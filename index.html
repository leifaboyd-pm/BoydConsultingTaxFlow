function init() {
  state.transactions = Store.get('exp.transactions', []);
  state.rules = Store.get('exp.rules', []);
  state.businessPurposes = Store.get('exp.business_purposes', []);
  state.settings = { ...DEFAULT_SETTINGS, ...Store.get('exp.settings', {}) };
  state.currentStep = Store.get('exp.current_step', 'upload');
  if (state.transactions.length === 0) state.currentStep = 'upload';

  // Migrate v0.1 data: the schema changed from `excluded` (default false) to
  // `included` (default false). Old data had `excluded=false` meaning "in
  // the report" so flip the semantics for those records.
  let migrated = 0;
  for (const tx of state.transactions) {
    if (tx.included === undefined) {
      // Old schema: excluded=true means kept out; default included was implied
      tx.included = false;  // New v0.2 default — user picks what to include
      delete tx.excluded;
      migrated++;
    }
  }
  if (migrated > 0) {
    save();
    console.log(`Migrated ${migrated} transactions from v0.1 schema.`);
  }

  document.getElementById('em-settingsBtn').onclick = openSettingsModal;

  setStatus('synced', `${state.transactions.length} transactions · ${state.rules.length} rules`);
  render();
}



// ----- Public entry point -----
// Tax OS calls ExpenseModule.render(rootEl, { taxOSState }) on view enter.
function publicRender(rootEl, ctx = {}) {
  // Inject the module's internal DOM scaffold inside the Tax OS view container,
  // wrapped in .expmod for CSS scoping.
  rootEl.innerHTML = `
    <div class="expmod">
      <div id="em-stepIndicator"></div>
      <main id="em-viewContainer"></main>
      <div id="em-modalRoot"></div>
      <div id="em-toastRoot"></div>
      <div id="printReport" class="em-print-only"></div>
    </div>
  `;

  // Hydrate persistent state on first call this session
  if (!state._hydrated) {
    state.rules = Store.get('exp.rules', []);
    state.businessPurposes = Store.get('exp.business_purposes', []);
    state.settings = { ...DEFAULT_SETTINGS, ...Store.get('exp.settings', {}) };
    state.txMeta = Store.get('exp.tx_meta', {}) || {};

    // MIGRATION: fold any old exp.transactions data into txMeta so we don't
    // lose past work. Old shape had business_purpose/included as fields on
    // each transaction; migrate them into the side map keyed by id.
    const legacyTransactions = Store.get('exp.transactions', []);
    if (legacyTransactions && legacyTransactions.length > 0) {
      let migrated = 0;
      for (const oldTx of legacyTransactions) {
        if (!oldTx || !oldTx.id) continue;
        if (!state.txMeta[oldTx.id]) state.txMeta[oldTx.id] = {};
        const meta = state.txMeta[oldTx.id];
        if (oldTx.business_purpose && !meta.business_purpose) {
          meta.business_purpose = oldTx.business_purpose;
          migrated++;
        }
        if (oldTx.included && meta.included === undefined) {
          meta.included = true;
          migrated++;
        }
        if (oldTx.note && !meta.note) {
          meta.note = oldTx.note;
          migrated++;
        }
      }
      if (migrated > 0) {
        saveTxMeta();
        console.log(`Migrated ${migrated} metadata fields from legacy exp.transactions.`);
      }
      // We DON'T delete exp.transactions in case the user rolls back; harmless.
    }

    // Always start on review — no more upload step
    state.currentStep = 'review';

    // Hydrate date range (default to YTD if never set)
    const savedRange = Store.get('exp.date_range', null);
    if (savedRange) {
      state.dateRange = savedRange;
    } else {
      // First time — default to YTD
      const ytd = computeDateRangeFromPreset('ytd');
      state.dateRange = { from: ytd.from, to: ytd.to, preset: 'ytd' };
    }

    // Hydrate filters (default to none)
    const savedFilters = Store.get('exp.filters', null);
    if (savedFilters) {
      state.filters = { ...state.filters, ...savedFilters };
    }

    // Inherit AI key from Tax OS if module doesn't have its own set
    try {
      const taxOSKey = ctx.taxOSState && ctx.taxOSState.settings && ctx.taxOSState.settings.ai_api_key;
      if (taxOSKey && !state.settings.ai_api_key) {
        state.settings.ai_api_key = taxOSKey;
        // Don't persist — just use it for this session. Tax OS owns the key.
      }
    } catch (e) { /* ignore */ }

    state._hydrated = true;
  }

  // ALWAYS refresh from Tax OS ledger on every render — so new uploads to
  // Tax OS are immediately visible in Expense Reports.
  const taxOSTransactions = (ctx.taxOSState && Array.isArray(ctx.taxOSState.transactions))
    ? ctx.taxOSState.transactions
    : [];
  refreshFromLedger(taxOSTransactions);

  // If ledger is empty, land on an informational screen instead of the old upload step.
  // The user is expected to import via the main Tax OS Import CSV view.
  if (state.transactions.length === 0) {
    document.getElementById('em-viewContainer').innerHTML = `
      <div class="card" style="text-align:center;padding:56px 32px">
        <div style="font-family:var(--sans);font-size:32px;font-weight:600;color:var(--navy);margin-bottom:8px">No expenses in your ledger yet</div>
        <p style="color:var(--ink-2);font-size:14px;max-width:520px;margin:12px auto;line-height:1.6">
          Expense Reports reads directly from your main Tax OS transaction ledger.
          Import a CSV using the <strong>Import CSV</strong> section in the sidebar,
          then return here to categorize, review, and export.
        </p>
        <button class="btn btn-primary mt-16" onclick="window.location.hash='#upload'">Go to Import CSV</button>
      </div>
    `;
    document.getElementById('em-stepIndicator').innerHTML = '';
    return;
  }

  // Run the module's internal render
  render();
}

return { render: publicRender };

})();

/* ----- Donut + Bars ----- */
function renderDonut(cats, total) {
  if (!cats.length || !total) return `<div class="muted tiny">No expenses yet.</div>`;
  const r = 64, cx = 80, cy = 80, circ = 2 * Math.PI * r;
  let acc = 0;
  const segs = cats.map(c => {
    const frac = c.total / total;
    const len = circ * frac;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c.cat.color}" stroke-width="22" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${cx} ${cy})" />`;
    acc += len;
    return seg;
  }).join('');
  return `
    <div class="donut-wrap">
      <svg class="donut-svg" width="160" height="160" viewBox="0 0 160 160">
        ${segs}
        <text x="80" y="76" text-anchor="middle" font-family="Sora, sans-serif" font-weight="600" font-size="22" fill="#16181D">${fmt.moneyShort(total)}</text>
        <text x="80" y="96" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="9.5" fill="#74777E" letter-spacing="1">TOTAL SPEND</text>
      </svg>
      <div class="donut-legend">
        ${cats.map(c => `
          <div class="donut-row">
            <div class="donut-sw" style="background:${c.cat.color}"></div>
            <div class="donut-name">${c.cat.name}</div>
            <div class="donut-val">${fmt.moneyShort(c.total)}</div>
            <div class="muted tiny" style="width:38px;text-align:right;">${(c.total/total*100).toFixed(0)}%</div>
          </div>`).join('')}
      </div>
    </div>`;
}

function renderBars(months) {
  const data = months.map(m => ({
    m,
    label: new Date(m+'-01T00:00:00').toLocaleDateString('en-US',{month:'short'}),
    val: expenseTotal(state.transactions.filter(t => (t.date||'').slice(0,7) === m))
  }));
  const max = Math.max(...data.map(d => d.val), 1);
  return `
    <div class="bar-chart">
      ${data.map(d => `
        <div class="bar-col">
          <div class="bar-rect" style="height:${(d.val/max*130)+10}px;background:${d.m === months[months.length-1] ? 'var(--accent)' : 'var(--accent-2)'};opacity:${d.m === months[months.length-1] ? 1 : 0.65};">
            <span class="bar-val">${fmt.moneyShort(d.val)}</span>
          </div>
          <div class="bar-label">${d.label}</div>
        </div>`).join('')}
    </div>`;
}

/* ----- Helpers ----- */
function escapeHTML(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function simplifyVendor(desc) {
  if (!desc) return '';
  return desc
    // Strip merchant code prefixes BEFORE we strip asterisks
    .replace(/\b(TST\s*\*|SQ\s*\*|SP\s*\*|DD\s*\*|PY\s*\*|CKE\s*\*|IN\s*\*)/gi, ' ')
    // Strip digits, asterisks, hashes, ampersands
    .replace(/[\d#*&]+/g, ' ')
    // Strip generic banking + transaction terms
    .replace(/\b(STORE|SHOP|TRANSACTION|PURCHASE|PMT|PAYMENT|POS|CHARGE|CHRG|FEE|MOBILE|ONLINE|RECURRING|AUTO\s+PAY|ACH|EFT|DEBIT|CREDIT|DESC|REF|REFERENCE|MEMO|TYPE|DRAFT|WIRE|TRANSFER|XFER|WITHDRAWAL|DEPOSIT)\b/gi, ' ')
    // Strip US state codes anywhere (not just at end)
    .replace(/\b(CA|TX|NY|NV|AZ|FL|WA|OR|MA|MN|CO|GA|NC|SC|VA|MD|IL|OH|MI|PA|NJ|CT|TN|MO|IN|WI|UT|KS|OK|AR|LA|AL|MS|KY|HI|AK|NM|MT|ID|WY|ND|SD|NE|IA|ME|NH|VT|RI|DE|WV|DC)\b/gi, ' ')
    .replace(/[,;:.]/g, ' ')
    .replace(/\s{2,}/g, ' ')
    .trim()
    .split(' ')
    .filter(Boolean)
    .slice(0, 3)        // 3 distinctive tokens is the right balance
    .join(' ');
}
function renderCategoryChip(catId) {
  const c = CAT_BY_ID[catId] || CAT_BY_ID.uncategorized;
  return `<span class="chip" style="background:${c.color}1F;color:${c.color}">${c.name}</span>`;
}
function renderConfidence(conf) {
  if (conf == null) return '';
  const pct = Math.round(conf * 100);
  const cls = conf >= 0.85 ? '' : (conf >= 0.6 ? 'med' : 'low');
  return `<span class="confbar"><span class="confbar-fill ${cls}" style="width:${pct}%"></span></span><span class="muted tiny amt">${pct}%</span>`;
}
function renderRisk(r) {
  if (!r) return '';
  const labels = { green:'Routine', yellow:'Review', red:'Risk', gray:'Excluded' };
  return `<span><span class="risk-dot risk-${r}"></span><span class="muted tiny">${labels[r]}</span></span>`;
}
function renderStatusChip(s) {
  const map = {
    auto:      { label:'Auto-approved', cls:'chip-green' },
    pending:   { label:'Needs review',   cls:'chip-yellow' },
    approved:  { label:'Approved',       cls:'chip-green' },
    corrected: { label:'Corrected',      cls:'chip-blue' },
    excluded:  { label:'Excluded',       cls:'chip-gray' },
  };
  const m = map[s] || { label:s, cls:'chip-gray' };
  return `<span class="chip ${m.cls}">${m.label}</span>`;
}

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCSV(reader.result);
    if (rows.length < 2) { toast('CSV appears empty or malformed.'); return; }
    const headerIdx = detectHeaderRow(rows);
    const headers = rows[headerIdx] || [];
    const mapping = autoMapHeaders(headers);
    state.upload = { rows, headers, mapping, headerIdx, filename: file.name };
    render();
  };
  reader.readAsText(file);
}

          <div class="map-col">Amount (signed)</div>
          <div class="map-arrow">→</div>
          <div><select id="map_amount">${colOpts(u.mapping.amount)}</select></div>

          <div class="map-col">Debit (alt)</div>
          <div class="map-arrow">→</div>

        <div class="field-hint mt-8">

        </div>
        ${(() => {
          const warns = [];
          if (u.mapping.description < 0) warns.push('No <strong>Description</strong> column mapped — pick one.');
          if (u.mapping.date < 0) warns.push('No <strong>Date</strong> column mapped — pick one.');
          if (u.mapping.amount < 0 && u.mapping.debit < 0 && u.mapping.credit < 0) warns.push('No <strong>Amount</strong> column mapped — pick one (or a Debit/Credit pair).');
          if (u.mapping.amount < 0 && u.mapping.debit >= 0 && u.mapping.debit === u.mapping.credit) {
            warns.push('<strong>Debit</strong> and <strong>Credit</strong> point at the same column — that means it&rsquo;s really a single signed-amount column. Map it to <strong>Amount (signed)</strong> and set both Debit and Credit to <strong>&mdash; none &mdash;</strong>.');
          }
          return warns.length ? `<div class="mapping-warn">${warns.map(w => `<div>⚠ ${w}</div>`).join('')}</div>` : '';
        })()}
      </div>

      <div class="card-eyebrow mb-8">Preview · first 5 data rows under the selected header</div>

          <thead><tr>${u.headers.map(h => `<th>${escapeHTML(h || '(empty)')}</th>`).join('')}</tr></thead>

            ${sample.length === 0 ? `<tr><td colspan="${u.headers.length}" class="muted tiny" style="text-align:center;padding:16px">No data rows under this header. Try a different header row.</td></tr>` :
              sample.map(r => `<tr>${(r||[]).map(c => `<td>${escapeHTML(c||'')}</td>`).join('')}</tr>`).join('')}
          </tbody>
        </table>

      <div class="row mt-16" style="justify-content:flex-end">
        <button class="btn" id="abortBtn">Discard</button>
        <button class="btn btn-primary" id="importBtn">Import & categorize →</button>
      </div>

  `;

  document.getElementById('headerRowSel').onchange = (e) => {
    const idx = parseInt(e.target.value);
    state.upload.headerIdx = idx;
    state.upload.headers = state.upload.rows[idx] || [];
    state.upload.mapping = autoMapHeaders(state.upload.headers);
    render();
  };

  ['date','description','amount','debit','credit','type'].forEach(k => {
    const el = document.getElementById('map_'+k);
    if (el) el.onchange = (e) => {
      state.upload.mapping[k] = parseInt(e.target.value);
    };
  });
  document.getElementById('cancelUpload').onclick = () => { state.upload = null; render(); };
  document.getElementById('abortBtn').onclick = () => { state.upload = null; render(); };
  document.getElementById('importBtn').onclick = doImport;
}

async function doImport() {
  try {
    const u = state.upload;
    if (!u) { toast('No file staged.'); return; }
    if (u.mapping.description < 0) {
      toast('Pick a Description column before importing.');
      return;
    }
    if (u.mapping.amount < 0 && u.mapping.debit < 0 && u.mapping.credit < 0) {
      toast('Pick an Amount column (or Debit/Credit pair) before importing.');
      return;
    }
    if (u.mapping.date < 0) {
      toast('Pick a Date column before importing.');
      return;
    }
    // Guard: if Debit and Credit point at the same column, that's a single
    // signed-amount column — refuse to import (auto-detect should have caught
    // this, but the user could have manually mapped it this way).
    if (u.mapping.amount < 0 && u.mapping.debit >= 0 && u.mapping.debit === u.mapping.credit) {
      toast('Debit and Credit are mapped to the same column. That column is a signed Amount — map it to "Amount (signed)" instead and set Debit/Credit to "— none —".');
      return;
    }

    const txns = buildTransactions(u.rows, u.mapping, u.headerIdx || 0);
    if (txns.length === 0) {
      const m = txns._meta || {};
      let why = 'No usable rows found.';
      if (m.attempted === 0) why = 'No data rows under the selected header. Try a different header row.';
      else if (m.skippedNoDesc === m.attempted) why = `All ${m.attempted} rows had a blank Description column. Re-check the column mapping.`;
      else if (m.skippedBadAmount === m.attempted) why = `All ${m.attempted} rows had an unreadable Amount. Try the Debit/Credit columns instead.`;
      else why = `Skipped ${m.skippedNoDesc} blank-description and ${m.skippedBadAmount} bad-amount rows. Re-check column mapping.`;
      toast(why);
      return;
    }

    // Sanity check: if every imported row has amount === 0, the column mapping
    // is almost certainly wrong (most common cause: signed Amount column was
    // mapped to both Debit and Credit, which cancel out).
    const allZero = txns.every(t => t.amount === 0);
    if (allZero) {
      toast(`All ${txns.length} rows imported as $0.00 — the Amount column mapping is wrong. If your bank uses a single signed column (like "Debit/Credit"), map it to "Amount (signed)" and leave Debit/Credit on "— none —".`);
      return;
    }

    // De-dupe against existing (date + amount + first 24 chars of description)
    const sig = (t) => `${t.date}|${t.amount.toFixed(2)}|${(t.description||'').slice(0,24).toLowerCase()}`;
    const existing = new Set(state.transactions.map(sig));
    const fresh = txns.filter(t => !existing.has(sig(t)));
    const dupes = txns.length - fresh.length;

    // Categorize (each in its own try so one bad row can't kill the import)
    fresh.forEach(t => {
      try {
        const r = categorize(t, state.rules, state.settings);
        Object.assign(t, r);
      } catch (err) {
        console.error('Categorize failed for', t, err);
        t.category = 'review';
        t.confidence = 0;
        t.risk = 'yellow';
        t.status = 'pending';
        t.reason = 'Categorizer error — review manually.';
      }
    });

    state.transactions = state.transactions.concat(fresh);
    saveTransactions();
    state.upload = null;

    toast(`Imported ${fresh.length} transactions${dupes ? ` · skipped ${dupes} duplicates` : ''}.`);

    // Auto-run AI on the items the rule engine couldn't confidently handle
    const s = state.settings;
    if (s.ai_enabled && (s.ai_api_key || '').trim() && s.ai_auto_on_import) {
      const threshold = s.ai_threshold || 0.7;
      const lowConfFresh = fresh.filter(t =>
        t.status !== 'approved' &&
        t.category !== 'excluded' &&
        ((t.confidence || 0) < threshold || t.category === 'uncategorized' || t.category === 'review')
      );
      if (lowConfFresh.length > 0) {
        const prog = showAIProgress(`AI is categorizing ${lowConfFresh.length} ambiguous items`);
        try {
          const { updated } = await aiCategorizeMany(lowConfFresh, s, prog.update);
          saveTransactions();
          prog.close();
          toast(`✓ AI handled ${updated} of ${lowConfFresh.length} ambiguous items.`);
        } catch (err) {
          prog.close();
          toast('AI auto-run failed: ' + err.message + ' (rules-based categorization saved.)');
        }
      }
    }

    navigate('dashboard');
  } catch (err) {
    console.error('Import error:', err);
    toast('Import failed: ' + (err.message || 'unknown error') + '. Check console.');
  }
}

/* =========================================================================
   REVIEW QUEUE
   ========================================================================= */
function renderReview(root) {
  const queue = reviewQueue();
  if (queue.length === 0) {
    root.innerHTML = `
      <div class="card empty">
        <h3>Nothing to review.</h3>
        <p>Every transaction is auto-approved or already handled. Upload more transactions or revisit your <a href="#" onclick="navigate('rules');return false;">rules</a>.</p>
      </div>`;
    return;
  }

  const aiReady = state.settings.ai_enabled && (state.settings.ai_api_key || '').trim().length > 0;
  const aiBanner = aiReady ? `
    <div class="ai-banner">
      <div class="ai-banner-text">
        <strong>Force-categorize the queue.</strong> Re-runs ${queue.length} review items through Claude in decisive mode — the model is instructed to make educated guesses instead of escalating again.
      </div>
      <button class="btn btn-primary btn-sm" id="aiRunReviewBtn">Re-classify with AI →</button>
    </div>` : `
    <div class="ai-banner">
      <div class="ai-banner-text">
        <strong>Spending too much time on the review queue?</strong> Enable AI categorization in <a href="#" onclick="navigate('settings');return false;" style="color:var(--accent);font-weight:600">Settings</a> to handle ambiguous items automatically.
      </div>
    </div>`;

  root.innerHTML = `
    ${aiBanner}
    ${renderBrandBand({
      eyebrow: 'Awaiting decision',
      title: `${queue.length} transactions need your review`,
      sub: 'Sorted by lowest confidence first · save corrections as rules to cascade going forward'
    })}
    <div id="reviewList">
      ${queue.map(t => renderReviewCard(t)).join('')}
    </div>
  `;
  bindReviewActions();

  // Wire AI button if shown
  const aiBtn = document.getElementById('aiRunReviewBtn');
  if (aiBtn) aiBtn.onclick = async () => {
    const reviewItems = state.transactions.filter(t =>
      t.status === 'pending' && t.category !== 'excluded'
    );
    if (reviewItems.length === 0) { toast('Nothing in review queue.'); return; }
    aiBtn.disabled = true; aiBtn.textContent = 'Working…';
    const prog = showAIProgress(`Decisively categorizing ${reviewItems.length} review items`);
    try {
      const { updated, errors, retried, unresolved } = await aiCategorizeMany(reviewItems, state.settings, prog.update, { decisive: true });
      saveTransactions();
      prog.close();
      const parts = [`✓ Categorized ${updated} of ${reviewItems.length} items`];
      if (retried) parts.push(`${retried} required a retry pass`);
      if (unresolved) parts.push(`${unresolved} couldn't be resolved (likely truly ambiguous — categorize manually)`);
      if (errors.length) parts.push(`${errors.length} batch(es) errored — see console`);
      toast(parts.join(' · '));
      render();
    } catch (err) {
      prog.close();
      toast('AI failed: ' + err.message);
      aiBtn.disabled = false; aiBtn.textContent = 'Re-classify with AI →';
    }
  };
}

function renderReviewCard(t) {
  const cat = CAT_BY_ID[t.category] || CAT_BY_ID.review;
  const riskCls = t.risk === 'red' ? 'risk-high' : (t.risk === 'green' ? 'risk-low' : '');
  return `
    <div class="review-card ${riskCls}" data-id="${t.id}">
      <div>
        <div class="row">
          <div class="review-vendor">${escapeHTML(simplifyVendor(t.description) || t.description)}</div>
          ${renderRisk(t.risk)}
        </div>
        <div class="review-meta">${fmt.date(t.date)} · ${escapeHTML(t.description)}</div>
        <div class="review-suggest">
          <div class="review-suggest-label">AI suggestion</div>
          <div class="row" style="justify-content:space-between">
            <div>
              ${renderCategoryChip(t.category)}
              ${renderConfidence(t.confidence)}
            </div>
          </div>
          <div class="muted tiny mt-8" style="line-height:1.5">${escapeHTML(t.reason || '')}</div>
        </div>
        <div class="review-actions">
          <button class="btn btn-sm btn-primary" data-act="approve" data-id="${t.id}">Approve as ${cat.name}</button>
          <select class="btn btn-sm" data-act="changecat" data-id="${t.id}" style="padding-right:24px">
            <option value="">Change category…</option>
            ${CATEGORIES.filter(c => !['review','uncategorized'].includes(c.id)).map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
          </select>
          <button class="btn btn-sm" data-act="exclude" data-id="${t.id}">Exclude</button>

function bindReviewActions() {
  document.querySelectorAll('[data-act]').forEach(el => {
    if (el.tagName === 'SELECT') {
      el.onchange = (e) => {
        const id = e.target.dataset.id;
        const v = e.target.value;
        if (!v) return;
        applyReviewAction(id, 'changecat', v);
      };
    } else {
      el.onclick = (e) => {
        const id = e.target.dataset.id;
        const act = e.target.dataset.act;
        applyReviewAction(id, act);
      };
    }
  });
}

function applyReviewAction(id, act, value) {
  const t = state.transactions.find(x => x.id === id);
  if (!t) return;

  if (act === 'approve') {
    t.status = 'approved';
    t.confidence = 1.0;
    t.categorized_by = 'user';
  } else if (act === 'changecat') {
    t.category = value;
    t.status = 'corrected';
    t.confidence = 1.0;
    t.risk = (CAT_BY_ID[value]?.deductible === 'no') ? 'gray' : 'green';
    t.reason = `User-corrected to ${CAT_BY_ID[value]?.name}`;
    t.categorized_by = 'user';
    promptSaveRule(t);
  } else if (act === 'exclude') {
    t.status = 'excluded';
    t.category = 'excluded';
    t.risk = 'gray';
    t.categorized_by = 'user';
  } else if (act === 'rule') {
    promptSaveRule(t, true);
    return;
  }

  saveTransactions();
  render();
}

/**
 * Unified rule editor — used for both creating and editing rules.
 * - existingRule: optional, if editing an existing rule
 * - sourceTxn: optional, the transaction the user clicked "Save as rule" on
 *
 * The user sees a live preview of which transactions a pattern matches,
 * updated as they type. This eliminates the "I saved a rule but it did nothing"
 * mystery by making the matching logic visible.
 */
function openRuleEditor({ existingRule = null, sourceTxn = null } = {}) {
  const isEdit = !!existingRule;
  const t = sourceTxn;
  const initialPattern = existingRule
    ? existingRule.pattern
    : (t ? simplifyVendor(t.description) || t.description.slice(0, 32) : '');
  const initialAction = existingRule ? existingRule.action : 'categorize';
  const initialCategory = existingRule
    ? (existingRule.category || 'office')
    : (t && t.category && t.category !== 'review' && t.category !== 'uncategorized' ? t.category : 'office');

  const categoryOptions = CATEGORIES
    .filter(c => !['uncategorized', 'review'].includes(c.id))
    .map(c => `<option value="${c.id}" ${c.id === initialCategory ? 'selected' : ''}>${c.name}</option>`)
    .join('');

  const html = `
    <div class="modal-h">
      <div class="modal-title">${isEdit ? 'Edit rule' : 'Save as rule'}</div>
      <button class="close-x" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      ${t ? `
        <div class="card-eyebrow">Source transaction</div>
        <div class="muted tiny mb-16" style="background:var(--bg-2);padding:10px 12px;border-radius:var(--radius-sm);font-family:var(--mono);line-height:1.5">
          <div>${escapeHTML(t.description)}</div>
          <div style="margin-top:4px">${fmt.date(t.date)} · ${fmt.money(t.amount)}</div>
        </div>` : ''}

      <div class="field">
        <label>Match when description contains <span class="muted tiny">(any order)</span></label>
        <input type="text" id="rulePattern" value="${escapeHTML(initialPattern)}" autofocus />
        <div class="field-hint">All words you enter must appear in the transaction description. Shorter = matches more, longer = more specific.</div>
      </div>

      <div id="ruleMatchPreview" style="margin:14px 0 18px;padding:12px;background:var(--bg-2);border-radius:var(--radius-sm);min-height:60px"></div>

      <div class="field">
        <label>When matched</label>
        <select id="ruleAction">
          <option value="categorize" ${initialAction === 'categorize' ? 'selected' : ''}>Categorize as…</option>
          <option value="always_review" ${initialAction === 'always_review' ? 'selected' : ''}>Always send to review queue</option>
          <option value="exclude" ${initialAction === 'exclude' ? 'selected' : ''}>Exclude from P&amp;L (transfer/draw/CC pmt)</option>
          <option value="never_expense" ${initialAction === 'never_expense' ? 'selected' : ''}>Never expense (mark as Personal)</option>
        </select>
      </div>

      <div class="field" id="ruleCatField" style="${initialAction === 'categorize' ? '' : 'display:none'}">
        <label>Category</label>
        <select id="ruleCategory">${categoryOptions}</select>
      </div>

      <div class="field mt-12" style="padding-top:12px;border-top:1px solid var(--border)">
        <label class="row" style="font-weight:400;font-size:13px;color:var(--ink-2);cursor:pointer">
          <input type="checkbox" id="ruleOverride" />
          <span>Override transactions I&rsquo;ve already manually corrected</span>
        </label>
        <div class="field-hint">By default, transactions where you clicked "Change category" or saved as a different rule are protected from being changed. Check this to apply the rule to them anyway.</div>
      </div>
    </div>

    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="saveRuleBtn">${isEdit ? 'Update rule' : 'Save rule'}</button>
    </div>
  `;
  openModal(html);

  const patternInput = document.getElementById('rulePattern');
  const previewEl = document.getElementById('ruleMatchPreview');
  const actionSel = document.getElementById('ruleAction');
  const catField = document.getElementById('ruleCatField');

  // Live match preview — recomputes as user types. Shows what applyNewRule
  // will ACTUALLY do, not just pattern matches, to eliminate the "matched 4
  // updated 2" confusion.
  function updatePreview() {
    const pattern = patternInput.value.trim();
    if (!pattern) {
      previewEl.innerHTML = '<div class="muted tiny">Enter a pattern above to see what it would match.</div>';
      return;
    }
    const tempRule = { pattern, scope: 'description_contains', action: actionSel.value };
    const allMatches = state.transactions.filter(tx => matchesRule(tx.description, tempRule));
    const override = document.getElementById('ruleOverride')?.checked || false;

    // Categorize matches by what will happen to each
    const willTouch = [];
    const willSkipCorrected = [];
    const willSkipExcluded = [];
    for (const tx of allMatches) {
      if (tx.category === 'excluded' && tempRule.action !== 'exclude' && tempRule.action !== 'never_expense') {
        willSkipExcluded.push(tx);
      } else if (tx.status === 'corrected' &&
                 tempRule.action !== 'exclude' &&
                 tempRule.action !== 'never_expense' &&
                 !override) {
        willSkipCorrected.push(tx);
      } else {
        willTouch.push(tx);
      }
    }

    if (allMatches.length === 0) {
      // === Diagnostic mode: explain why nothing matches ===
      const patternTokens = tokenize(pattern);
      // Helper: true if `tok` appears in this description's token set
      // (whole, split, or substring-of-token). Mirrors matchesRule.
      const tokInDesc = (tok, descSet, descArr) => {
        if (descSet.has(tok)) return true;
        if (tok.length >= 3 && descArr.some(d => d.includes(tok))) return true;
        return false;
      };
      const tokenStats = patternTokens.map(tok => {
        const txns = state.transactions.filter(tx => {
          const set = tokenSet(tx.description);
          return tokInDesc(tok, set, [...set]);
        });
        return { tok, count: txns.length };
      });
      tokenStats.sort((a, b) => a.count - b.count);

      const partialMatches = state.transactions
        .map(tx => {
          const descSet = tokenSet(tx.description);
          const descArr = [...descSet];
          const hits = patternTokens.filter(t => tokInDesc(t, descSet, descArr));
          return { tx, score: hits.length, hits };
        })
        .filter(x => x.score > 0 && x.score < patternTokens.length)
        .sort((a, b) => b.score - a.score)
        .slice(0, 5);

      const tokenStatsHTML = tokenStats.map(s => {
        const color = s.count === 0 ? 'var(--warn)' : 'var(--ink-2)';
        const label = s.count === 0 ? 'NEVER appears in your data' : `appears in ${s.count} txn${s.count === 1 ? '' : 's'}`;
        return `<div style="margin:3px 0;font-size:12px;color:${color}">
          <span style="font-family:var(--mono);font-weight:600">"${escapeHTML(s.tok)}"</span> — ${label}
        </div>`;
      }).join('');

      let diagnosticHTML = `
        <div class="tiny" style="color:var(--warn);font-weight:600;margin-bottom:10px">⚠ No transactions match this pattern.</div>
        <div class="tiny mb-12" style="color:var(--ink-3)">Token-by-token breakdown — every word must appear:</div>
        ${tokenStatsHTML}`;

      if (partialMatches.length > 0) {
        const examplesHTML = partialMatches.map(pm => {
          const descTokens = new Set(tokenize(pm.tx.description));
          const missing = patternTokens.filter(t => !descTokens.has(t));
          return `<div style="margin:8px 0;padding:8px 10px;background:var(--card);border-radius:6px;border-left:2px solid var(--accent-2)">
            <div style="font-family:var(--mono);font-size:11px;line-height:1.4">${escapeHTML(pm.tx.description)}</div>
            <div class="muted tiny mt-4">Has: ${pm.hits.map(t => `<code style="font-family:var(--mono);background:var(--bg-2);padding:1px 5px;border-radius:3px">${escapeHTML(t)}</code>`).join(' ')} · Missing: ${missing.map(t => `<code style="font-family:var(--mono);background:rgba(184,134,47,0.18);padding:1px 5px;border-radius:3px">${escapeHTML(t)}</code>`).join(' ')}</div>
            <div class="row mt-4" style="gap:6px">
              <button class="btn btn-sm btn-ghost" data-fixpattern="${escapeHTML(pm.hits.join(' '))}" style="font-size:11px;padding:3px 8px">Use "${pm.hits.join(' ')}" instead</button>
            </div>
          </div>`;
        }).join('');
        diagnosticHTML += `
          <div class="tiny mt-16 mb-8" style="color:var(--ink-3);font-weight:600">Closest transactions (some pattern words match):</div>
          ${examplesHTML}`;
      } else {
        diagnosticHTML += `<div class="tiny mt-12" style="color:var(--ink-3)">No transactions contain ANY of these pattern words. The bank's description format is probably very different. Open the Transactions page in another tab and copy a real description.</div>`;
      }
      previewEl.innerHTML = diagnosticHTML;
      previewEl.querySelectorAll('[data-fixpattern]').forEach(btn => {
        btn.onclick = (e) => {
          e.preventDefault();
          patternInput.value = btn.dataset.fixpattern;
          updatePreview();
          patternInput.focus();
        };
      });
      return;
    }

    // === Match mode: show exactly what will happen ===
    const headerColor = willTouch.length > 0 ? 'var(--accent)' : 'var(--warn)';
    const headerIcon  = willTouch.length > 0 ? '✓' : '⚠';
    let header = `<div class="tiny" style="color:${headerColor};font-weight:600;margin-bottom:8px">
      ${headerIcon} Pattern matches ${allMatches.length} transaction${allMatches.length === 1 ? '' : 's'} · <strong>${willTouch.length} will be updated</strong>
    </div>`;

    if (willSkipCorrected.length > 0) {
      header += `<div class="tiny" style="color:var(--warn);margin-bottom:6px">
        ${willSkipCorrected.length} skipped — already manually corrected. ${override ? '' : '<strong>Tick "Override" below to include them.</strong>'}
      </div>`;
    }
    if (willSkipExcluded.length > 0) {
      header += `<div class="tiny muted" style="margin-bottom:6px">${willSkipExcluded.length} already excluded — leaving alone</div>`;
    }

    // Show preview of items to be touched (most useful) plus a sample of skipped
    const showList = willTouch.slice(0, 4);
    const previewRows = showList.map(m => `
      <div class="tiny" style="display:flex;justify-content:space-between;gap:12px;margin:3px 0">
        <span style="font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHTML(m.description)}</span>
        <span class="muted">${fmt.dateShort(m.date)} · ${fmt.money(m.amount)}</span>
      </div>`).join('');
    const more = willTouch.length > 4 ? `<div class="muted tiny mt-8">…and ${willTouch.length - 4} more will be updated</div>` : '';

    previewEl.innerHTML = header + previewRows + more;
  }

  patternInput.oninput = updatePreview;
  actionSel.onchange = () => {
    catField.style.display = actionSel.value === 'categorize' ? '' : 'none';
    updatePreview();
  };
  document.getElementById('ruleOverride').onchange = updatePreview;
  updatePreview();

  document.getElementById('saveRuleBtn').onclick = () => {
    const pattern = patternInput.value.trim();
    if (!pattern) { toast('Enter a pattern.'); return; }
    if (tokenize(pattern).length === 0) { toast('Pattern needs at least one word.'); return; }

    const action = actionSel.value;
    const category = action === 'categorize'
      ? document.getElementById('ruleCategory').value
      : (action === 'never_expense' ? 'personal'
         : action === 'exclude' ? 'excluded'
         : 'review');

    const override = document.getElementById('ruleOverride')?.checked || false;

    if (isEdit) {
      existingRule.pattern = pattern;
      existingRule.label = pattern;
      existingRule.action = action;
      existingRule.category = category;
      saveRules();
      const result = applyNewRule(existingRule, { override });
      closeModal();
      toast(buildRuleResultToast('Rule updated', result));
      render();
    } else {
      const newRule = {
        id: 'rule_' + Math.random().toString(36).slice(2, 10),
        scope: 'description_contains',
        pattern,
        label: pattern,
        category,
        action,
        created_at: new Date().toISOString(),
        hit_count: 0
      };
      state.rules.push(newRule);
      saveRules();
      const result = applyNewRule(newRule, { override });
      closeModal();
      toast(buildRuleResultToast('Rule saved', result));
      render();
    }
  };
}

/** Build a clear, honest toast for rule-application results. */
function buildRuleResultToast(verb, result) {
  const parts = [`${verb} · applied to ${result.touched} transaction${result.touched === 1 ? '' : 's'}`];
  if (result.skippedCorrected > 0) {
    parts.push(`${result.skippedCorrected} skipped (manually corrected — toggle "Override" to include)`);
  }
  if (result.skippedExcluded > 0) {
    parts.push(`${result.skippedExcluded} skipped (already excluded)`);
  }
  return parts.join(' · ');
}

function exportTxnsCSV(txns) {
  const headers = ['Date','Description','Category','Status','Risk','Confidence','Amount','Reason','Notes'];
  const rows = txns.map(t => [
    t.date,
    `"${(t.description||'').replace(/"/g,'""')}"`,
    CAT_BY_ID[t.category]?.name || t.category,
    t.status || '',
    t.risk || '',
    t.confidence != null ? Math.round(t.confidence*100)+'%' : '',
    t.amount.toFixed(2),
    `"${(t.reason||'').replace(/"/g,'""')}"`,
    `"${(t.notes||'').replace(/"/g,'""')}"`
  ].join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  download(csv, `ledger-export-${new Date().toISOString().slice(0,10)}.csv`, 'text/csv');
}

function download(text, filename, mime) {
  const blob = new Blob([text], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 500);
}

function renderRules(root) {
  // Count hits and check for zero-hit rules
  state.rules.forEach(r => {
    r.hit_count = state.transactions.filter(t => t.matched_rule_id === r.id).length;
  });
  const zeroHitCount = state.rules.filter(r => r.hit_count === 0).length;

  root.innerHTML = `
    ${renderBrandBand({
      eyebrow: 'Categorization',
      title: `${state.rules.length} custom rule${state.rules.length===1?'':'s'}`,
      sub: `${VENDOR_PATTERNS.length} built-in vendor patterns active · rules win over AI suggestions`,
      actions: `${state.rules.length > 0 ? `<button class="btn btn-sm" id="reapplyRulesBtn">Re-apply all rules</button>` : ''}
                <button class="btn btn-sm btn-primary" id="addRuleBtn">+ New rule</button>`
    })}

    ${zeroHitCount > 0 ? `
      <div class="mapping-warn mb-16">
        <div>⚠ <strong>${zeroHitCount} rule${zeroHitCount === 1 ? ' is' : 's are'} matching 0 transactions.</strong> Click "Edit" to fix the pattern — usually the issue is words that don't appear in your bank's actual descriptions, or patterns that are too specific.</div>
      </div>` : ''}

    <div class="card" style="padding:0">
      ${state.rules.length === 0 ? `
        <div class="empty">
          <h3>No custom rules yet.</h3>
          <p>The built-in vendor library is doing the work. As you correct transactions, save them as rules and they'll cascade across history and future imports.</p>
        </div>
      ` : `
      <table class="tbl">
        <thead><tr>
          <th style="padding-left:22px">Pattern</th>
          <th>Action</th>
          <th>Category</th>
          <th class="num">Hits</th>
          <th style="width:140px"></th>
        </tr></thead>
        <tbody>
          ${state.rules.map(r => {
            const isZero = r.hit_count === 0;
            return `
            <tr style="${isZero ? 'background:rgba(184,134,47,0.06)' : ''}">
              <td style="padding-left:22px"><strong>${escapeHTML(r.pattern)}</strong></td>
              <td>${ruleActionLabel(r.action)}</td>
              <td>${renderCategoryChip(r.category || 'uncategorized')}</td>
              <td class="num">
                <span style="${isZero ? 'color:var(--warn);font-weight:600' : 'color:var(--accent);font-weight:600'}">${r.hit_count}</span>
              </td>
              <td>
                <button class="btn btn-sm btn-ghost" data-editrule="${r.id}">Edit</button>
                <button class="btn btn-sm btn-ghost" data-delrule="${r.id}">Delete</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`}
    </div>
  `;
  document.getElementById('addRuleBtn').onclick = openAddRule;
  const reapplyBtn = document.getElementById('reapplyRulesBtn');
  if (reapplyBtn) reapplyBtn.onclick = () => {
    const overrideCorrected = confirm(
      `Re-apply all ${state.rules.length} rules to your transaction history?\n\n` +
      `Click OK to override your manual corrections too (full re-application).\n` +
      `Click Cancel to skip — actually wait, OK = override.\n\n` +
      `If you want to re-apply rules but PRESERVE manual corrections, click "Edit" on each rule individually instead.`
    );
    if (overrideCorrected === null) return;
    let total = 0, totalSkipped = 0;
    for (const rule of state.rules) {
      const r = applyNewRule(rule, { override: overrideCorrected });
      total += r.touched;
      totalSkipped += r.skippedCorrected;
    }
    render();
    const parts = [`Rules applied to ${total} transaction${total === 1 ? '' : 's'}`];
    if (totalSkipped > 0) parts.push(`${totalSkipped} preserved (manual corrections)`);
    toast(parts.join(' · '));
  };
  document.querySelectorAll('[data-editrule]').forEach(b => {
    b.onclick = (e) => {
      const id = e.target.dataset.editrule;
      const rule = state.rules.find(r => r.id === id);
      if (rule) openRuleEditor({ existingRule: rule });
    };
  });
  document.querySelectorAll('[data-delrule]').forEach(b => {
    b.onclick = (e) => {
      const id = e.target.dataset.delrule;
      if (!confirm('Delete this rule?')) return;
      state.rules = state.rules.filter(r => r.id !== id);
      saveRules();
      let touched = 0;
      for (const t of state.transactions) {
        if (t.matched_rule_id !== id) continue;
        if (t.status === 'corrected' || t.status === 'approved') continue;
        const r = categorize(t, state.rules, state.settings);
        Object.assign(t, r);
        touched++;
      }
      saveTransactions();
      render();
      toast(`Rule deleted · ${touched} transaction${touched === 1 ? '' : 's'} re-evaluated`);
    };
  });
}

/** Slim "next tax due" indicator strip for the dashboard. Computes a quick
 *  estimate using the currently-set tax profile and surfaces the soonest
 *  upcoming federal + CA quarterly with outstanding balance. */
function renderTaxStripForDashboard() {
  const s = state.settings;
  const year = String(new Date().getFullYear());
  const figures = getCurrentYearTaxFigures();
  // Skip if no income data yet
  if (figures.grossIncomeYTD === 0) return '';

  const k1Income = Math.max(0, figures.projectedAnnualNet - (Number(s.tax_reasonable_salary) || 0));
  const estimate = computeTaxEstimate({
    k1Income,
    otherIncome: Number(s.tax_other_income) || 0,
    filingStatus: s.tax_filing_status || 'mfj',
    state: s.tax_state || 'CA',
    useQbi: !!s.tax_use_qbi,
    priorYearFederal: Number(s.tax_prior_year_federal) || 0,
    priorYearState: Number(s.tax_prior_year_state) || 0,
    strategy: s.tax_strategy || 'current_year',
  });

  const today = new Date().toISOString().slice(0, 10);
  const fedDates = federalQuarterlyDueDates(year);
  const caDates = caQuarterlyDueDates(year);

  // Find next upcoming federal due (with outstanding) and next CA (with share>0 and outstanding)
  const nextFed = fedDates.find(d => {
    if (d.dueDate < today) return false;
    const target = estimate.federal.quarterly[d.q - 1];
    const paid = paidForQuarter('federal', year, d.q);
    return target - paid > 1;
  });
  const nextCa = estimate.state ? caDates.filter(d => d.share > 0).find(d => {
    if (d.dueDate < today) return false;
    const target = estimate.state.quarterly[d.q - 1];
    const paid = paidForQuarter('california', year, d.q);
    return target - paid > 1;
  }) : null;

  if (!nextFed && !nextCa) return '';

  // Days until soonest
  const soonestDate = nextFed && nextCa
    ? (nextFed.dueDate < nextCa.dueDate ? nextFed.dueDate : nextCa.dueDate)
    : (nextFed || nextCa).dueDate;
  const daysUntil = Math.round((new Date(soonestDate) - new Date(today)) / 86400000);
  const urgent = daysUntil <= 14;

  const fedAmt = nextFed ? estimate.federal.quarterly[nextFed.q - 1] - paidForQuarter('federal', year, nextFed.q) : 0;
  const caAmt = nextCa ? estimate.state.quarterly[nextCa.q - 1] - paidForQuarter('california', year, nextCa.q) : 0;

  return `
    <div class="card mb-24" style="border-left:3px solid ${urgent ? 'var(--danger)' : 'var(--gold)'};padding:16px 22px">
      <div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
        <div>
          <div class="card-eyebrow" style="color:${urgent ? 'var(--danger)' : 'var(--gold-2)'}">Estimated tax · next due</div>
          <div style="font-family:var(--sans);font-size:16px;font-weight:600;color:var(--ink);margin-top:4px">
            ${fmt.money(fedAmt + caAmt, {absolute:true})} due ${formatDueDate(soonestDate)}
            <span class="muted tiny" style="font-weight:500">· ${daysUntil} day${daysUntil === 1 ? '' : 's'} away</span>
          </div>
          <div class="muted tiny mt-4">
            ${nextFed ? `Federal ${nextFed.label}: ${fmt.money(fedAmt, {absolute:true})}` : ''}
            ${nextFed && nextCa ? ' · ' : ''}
            ${nextCa ? `California ${nextCa.label}: ${fmt.money(caAmt, {absolute:true})}` : ''}
          </div>
        </div>
        <a href="#" onclick="navigate('estTax');return false;" class="btn btn-sm btn-primary">Open Estimated Tax →</a>
      </div>
    </div>`;
}

/* =========================================================================
   ESTIMATED TAX — quarterly federal & California estimator
   for S-corp owners (W-2 + K-1 distributions).

   This is decision-support, not tax prep. The math here is intended to
   answer "roughly what should I send to the IRS and FTB this quarter?"
   It does not replace a CPA. We surface assumptions explicitly so the
   user can sanity-check.
   ========================================================================= */

/* Tax brackets — using 2025 published rates as a base (close to 2026
   projected inflation-adjusted rates). User can override prior-year
   tax in settings to use safe-harbor calc instead. */

const FED_BRACKETS_2025 = {
  // [rate, threshold-where-bracket-starts]
  single: [
    [0.10, 0],       [0.12, 11925],   [0.22, 48475],
    [0.24, 103350],  [0.32, 197300],  [0.35, 250525], [0.37, 626350],
  ],
  mfj: [
    [0.10, 0],       [0.12, 23850],   [0.22, 96950],
    [0.24, 206700],  [0.32, 394600],  [0.35, 501050], [0.37, 751600],
  ],
  mfs: [
    [0.10, 0],       [0.12, 11925],   [0.22, 48475],
    [0.24, 103350],  [0.32, 197300],  [0.35, 250525], [0.37, 375800],
  ],
  hoh: [
    [0.10, 0],       [0.12, 17000],   [0.22, 64850],
    [0.24, 103350],  [0.32, 197300],  [0.35, 250500], [0.37, 626350],
  ],
};

const FED_STD_DEDUCTION_2025 = {
  single: 15000, mfj: 30000, mfs: 15000, hoh: 22500,
};

/* California brackets — 2024 published (most recent finalized).
   Top mental health surcharge of 1% on income > $1M is ignored here. */
const CA_BRACKETS_2024 = {
  single: [
    [0.01, 0],       [0.02, 10756],   [0.04, 25499],
    [0.06, 40245],   [0.08, 55866],   [0.093, 70606],
    [0.103, 360659], [0.113, 432787], [0.123, 721314],
  ],
  mfj: [
    [0.01, 0],       [0.02, 21512],   [0.04, 50998],
    [0.06, 80490],   [0.08, 111732],  [0.093, 141212],
    [0.103, 721318], [0.113, 865574], [0.123, 1442628],
  ],
  mfs: [
    [0.01, 0],       [0.02, 10756],   [0.04, 25499],
    [0.06, 40245],   [0.08, 55866],   [0.093, 70606],
    [0.103, 360659], [0.113, 432787], [0.123, 721314],
  ],
  hoh: [
    [0.01, 0],       [0.02, 21527],   [0.04, 51000],
    [0.06, 65744],   [0.08, 81364],   [0.093, 96107],
    [0.103, 490493], [0.113, 588593], [0.123, 980987],
  ],
};

const CA_STD_DEDUCTION_2024 = {
  single: 5540, mfj: 11080, mfs: 5540, hoh: 11080,
};

/* QBI / 199A SSTB phaseout thresholds for 2025.
   Mortgage brokerage is generally classified as a Specified Service
   Trade or Business (SSTB); QBI fully phases out above the upper limit. */
const QBI_SSTB_PHASEOUT_2025 = {
  single: { lower: 241950, upper: 291950 },
  mfj:    { lower: 483900, upper: 583900 },
  mfs:    { lower: 241950, upper: 291950 },
  hoh:    { lower: 241950, upper: 291950 },
};

/** Apply progressive brackets to a taxable-income amount. */
function applyBrackets(brackets, taxable) {
  if (taxable <= 0) return 0;
  let tax = 0;
  for (let i = 0; i < brackets.length; i++) {
    const [rate, threshold] = brackets[i];
    const nextThreshold = i + 1 < brackets.length ? brackets[i + 1][1] : Infinity;
    if (taxable > threshold) {
      const slice = Math.min(taxable, nextThreshold) - threshold;
      tax += slice * rate;
    }
  }
  return tax;
}

/** Compute the *marginal* bracket the next dollar of income would fall in. */
function marginalRate(brackets, taxable) {
  let rate = brackets[0][0];
  for (const [r, threshold] of brackets) {
    if (taxable >= threshold) rate = r;
  }
  return rate;
}

/** QBI deduction with SSTB phase-out applied. Returns deductible amount. */
function qbiDeduction(qbiIncome, taxableBeforeQbi, status) {
  if (qbiIncome <= 0) return 0;
  const phase = QBI_SSTB_PHASEOUT_2025[status] || QBI_SSTB_PHASEOUT_2025.single;
  if (taxableBeforeQbi >= phase.upper) return 0;
  const fullDeduction = 0.20 * qbiIncome;
  if (taxableBeforeQbi <= phase.lower) return fullDeduction;
  // Linear phase-out between lower and upper
  const phaseOutPct = (taxableBeforeQbi - phase.lower) / (phase.upper - phase.lower);
  return fullDeduction * (1 - phaseOutPct);
}

/**
 * The core tax estimate. Pure function: given the numbers, compute
 * the estimated annual federal + state liability and the quarterly
 * targets. Returns a structured breakdown so the UI can show the math.
 */
function computeTaxEstimate({
  k1Income,           // S-corp net income flowing to owner (after reasonable salary)
  otherIncome,        // Spouse W-2, interest, etc.
  filingStatus,       // 'single' | 'mfj' | 'mfs' | 'hoh'
  state,              // 'CA' | 'none'
  useQbi,             // bool
  priorYearFederal,   // for safe-harbor
  priorYearState,     // for safe-harbor
  strategy,           // 'current_year' | 'safe_harbor'
}) {
  const status = filingStatus || 'mfj';
  const fedBrackets = FED_BRACKETS_2025[status];
  const fedStdDed = FED_STD_DEDUCTION_2025[status];
  const caBrackets = state === 'CA' ? CA_BRACKETS_2024[status] : null;
  const caStdDed = state === 'CA' ? CA_STD_DEDUCTION_2024[status] : 0;

  // -------- Federal --------
  const grossForFed = Math.max(0, k1Income) + Math.max(0, otherIncome || 0);
  // Taxable income BEFORE QBI deduction (QBI is below-the-line, post-AGI, post-std-ded)
  const taxableBeforeQbi = Math.max(0, grossForFed - fedStdDed);
  const qbi = useQbi ? qbiDeduction(Math.max(0, k1Income), taxableBeforeQbi, status) : 0;
  const fedTaxable = Math.max(0, taxableBeforeQbi - qbi);
  const fedTaxCurrentYear = applyBrackets(fedBrackets, fedTaxable);
  const fedMarginal = marginalRate(fedBrackets, fedTaxable);

  // Safe-harbor: 100% (or 110% if AGI > 150K) of prior-year liability.
  const safeHarborMultiplier = grossForFed > 150000 ? 1.10 : 1.00;
  const fedSafeHarbor = (priorYearFederal || 0) * safeHarborMultiplier;
  const fedAnnual = strategy === 'safe_harbor' ? fedSafeHarbor : fedTaxCurrentYear;

  // -------- California --------
  let caTaxable = 0, caTaxCurrentYear = 0, caMarginal = 0, caSafeHarbor = 0, caAnnual = 0;
  if (state === 'CA') {
    // CA does NOT recognize QBI; uses its own std deduction
    caTaxable = Math.max(0, grossForFed - caStdDed);
    caTaxCurrentYear = applyBrackets(caBrackets, caTaxable);
    caMarginal = marginalRate(caBrackets, caTaxable);
    caSafeHarbor = (priorYearState || 0) * safeHarborMultiplier;
    caAnnual = strategy === 'safe_harbor' ? caSafeHarbor : caTaxCurrentYear;
  }

  // -------- Quarterly targets --------
  // Federal: even quarters
  const fedQuarterly = [0.25, 0.25, 0.25, 0.25].map(p => fedAnnual * p);
  // California: 30/40/0/30 (FTB Form 540-ES schedule)
  const caQuarterly = [0.30, 0.40, 0.00, 0.30].map(p => caAnnual * p);

  return {
    inputs: { k1Income, otherIncome, filingStatus: status, state, useQbi, strategy },
    federal: {
      gross: grossForFed,
      stdDeduction: fedStdDed,
      taxableBeforeQbi,
      qbiDeduction: qbi,
      taxable: fedTaxable,
      currentYearTax: fedTaxCurrentYear,
      safeHarborTax: fedSafeHarbor,
      safeHarborMultiplier,
      annual: fedAnnual,
      marginal: fedMarginal,
      quarterly: fedQuarterly,
      effectiveRate: grossForFed > 0 ? fedAnnual / grossForFed : 0,
    },
    state: state === 'CA' ? {
      gross: grossForFed,
      stdDeduction: caStdDed,
      taxable: caTaxable,
      currentYearTax: caTaxCurrentYear,
      safeHarborTax: caSafeHarbor,
      annual: caAnnual,
      marginal: caMarginal,
      quarterly: caQuarterly,
      effectiveRate: grossForFed > 0 ? caAnnual / grossForFed : 0,
    } : null,
    totalAnnual: fedAnnual + caAnnual,
    totalQuarterly: fedQuarterly.map((f, i) => f + caQuarterly[i]),
  };
}

/** Pull current-year YTD income & expenses from the transaction store. */
function getCurrentYearTaxFigures() {
  const year = String(new Date().getFullYear());
  const ytd = state.transactions.filter(t => (t.date || '').slice(0, 4) === year);
  const grossIncome = incomeTotal(ytd);
  const deductibleExpenses = expenseTotal(ytd);
  const netBeforeSalary = grossIncome - deductibleExpenses;

  // Project annualized: simple linear extrapolation based on days elapsed
  const yearStart = new Date(year + '-01-01');
  const today = new Date();
  const daysElapsed = Math.max(1, Math.floor((today - yearStart) / 86400000));
  const daysInYear = (parseInt(year, 10) % 4 === 0 && parseInt(year, 10) % 100 !== 0) || parseInt(year, 10) % 400 === 0 ? 366 : 365;
  const projectionMultiplier = daysInYear / daysElapsed;

  return {
    year,
    daysElapsed,
    daysInYear,
    grossIncomeYTD: grossIncome,
    deductibleExpensesYTD: deductibleExpenses,
    netBeforeSalaryYTD: netBeforeSalary,
    projectedAnnualGross: grossIncome * projectionMultiplier,
    projectedAnnualExpenses: deductibleExpenses * projectionMultiplier,
    projectedAnnualNet: netBeforeSalary * projectionMultiplier,
  };
}

/* ----- Quarterly due dates ----- */
function federalQuarterlyDueDates(year) {
  // 1040-ES due dates for tax year `year` (filed throughout that year + Jan of next)
  return [
    { q: 1, label: 'Q1', dueDate: `${year}-04-15`, period: 'Jan 1 – Mar 31' },
    { q: 2, label: 'Q2', dueDate: `${year}-06-15`, period: 'Apr 1 – May 31' },
    { q: 3, label: 'Q3', dueDate: `${year}-09-15`, period: 'Jun 1 – Aug 31' },
    { q: 4, label: 'Q4', dueDate: `${parseInt(year, 10) + 1}-01-15`, period: 'Sep 1 – Dec 31' },
  ];
}

function caQuarterlyDueDates(year) {
  // FTB 540-ES — same calendar dates as federal Q1/Q2/Q4, but with the
  // weird 30/40/0/30 split. Q3 has zero owed under California's schedule.
  return [
    { q: 1, label: 'Q1', dueDate: `${year}-04-15`, period: 'Jan 1 – Mar 31', share: 0.30 },
    { q: 2, label: 'Q2', dueDate: `${year}-06-15`, period: 'Apr 1 – May 31', share: 0.40 },
    { q: 3, label: 'Q3', dueDate: `${year}-09-15`, period: 'Jun 1 – Aug 31', share: 0.00 },
    { q: 4, label: 'Q4', dueDate: `${parseInt(year, 10) + 1}-01-15`, period: 'Sep 1 – Dec 31', share: 0.30 },
  ];
}

/* ----- Payment log persistence ----- */
function getTaxPayments() {
  return Store.get('bxp.tax_payments', []);
}
function saveTaxPayments(payments) {
  Store.set('bxp.tax_payments', payments);
}

function logTaxPayment(payment) {
  const payments = getTaxPayments();
  payments.push({
    id: 'pmt_' + Math.random().toString(36).slice(2, 10),
    ...payment,
    created_at: new Date().toISOString(),
  });
  saveTaxPayments(payments);
}

function deleteTaxPayment(id) {
  saveTaxPayments(getTaxPayments().filter(p => p.id !== id));
}

function paymentsForJurisdiction(jurisdiction, year) {
  return getTaxPayments().filter(p =>
    p.jurisdiction === jurisdiction && (p.date || '').slice(0, 4) === year
  );
}

function paidForQuarter(jurisdiction, year, q) {
  return paymentsForJurisdiction(jurisdiction, year)
    .filter(p => p.quarter === q)
    .reduce((sum, p) => sum + (p.amount || 0), 0);
}

/** Format a YYYY-MM-DD date as e.g. "Apr 15". */
function formatDueDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

/* =========================================================================
   OWNER COMPENSATION OPTIMIZER
   For non-originating S-corp owner-managers in California. Surfaces the
   real trade-off between W-2 salary, K-1 distributions, FICA cost, and
   Solo 401(k) contribution room.

   Pure functions for the math; UI just renders the tables.
   ========================================================================= */

/* Federal 2025 thresholds we need for FICA + retirement caps */
const FICA_2025 = {
  ss_rate_employee: 0.062,
  ss_rate_employer: 0.062,
  ss_wage_base: 176100,        // Social Security wage base (2025)
  medicare_rate_employee: 0.0145,
  medicare_rate_employer: 0.0145,
  addl_medicare_rate: 0.009,   // employee only, above threshold
  addl_medicare_threshold_mfj: 250000,
  addl_medicare_threshold_single: 200000,
};

const SOLO_401K_2025 = {
  employee_deferral_limit: 23500,   // 401(k) employee deferral
  employer_share_pct: 0.25,         // employer profit-share is 25% of W-2 wages
  total_combined_limit: 70000,      // employee + employer cap (2025)
};

const CA_PAYROLL_TAXES_2025 = {
  sdi_rate_employee: 0.011,    // CA SDI 1.1%, no wage cap as of 2024+
  sui_rate_employer: 0.034,    // CA SUI default new-employer rate
  sui_wage_base: 7000,         // CA SUI wage base $7K
  ett_rate_employer: 0.001,    // CA ETT 0.1%
  ett_wage_base: 7000,
  futa_rate: 0.006,            // FUTA 0.6% effective rate after credit
  futa_wage_base: 7000,
};

/**
 * Compute FICA both halves on W-2 wages.
 * Returns { employee, employer, total }
 */
function ficaOnWages(wages, filingStatus) {
  if (wages <= 0) return { employee: 0, employer: 0, total: 0 };
  const ss = Math.min(wages, FICA_2025.ss_wage_base) * FICA_2025.ss_rate_employee;
  const ssEr = Math.min(wages, FICA_2025.ss_wage_base) * FICA_2025.ss_rate_employer;
  const medicare = wages * FICA_2025.medicare_rate_employee;
  const medicareEr = wages * FICA_2025.medicare_rate_employer;
  const addlThreshold = filingStatus === 'mfj'
    ? FICA_2025.addl_medicare_threshold_mfj
    : FICA_2025.addl_medicare_threshold_single;
  const addlMedicare = Math.max(0, wages - addlThreshold) * FICA_2025.addl_medicare_rate;
  const employee = ss + medicare + addlMedicare;
  const employer = ssEr + medicareEr;
  return { employee, employer, total: employee + employer };
}

/**
 * Solo 401(k) maximum at a given W-2 salary.
 * Employee deferral is fixed; employer profit-share = 25% of W-2 wages,
 * subject to the combined limit.
 */
function solo401kCapacity(wages, employeeDeferralTarget) {
  const employeeMax = Math.min(SOLO_401K_2025.employee_deferral_limit, wages);
  const employee = Math.min(employeeDeferralTarget || 0, employeeMax);
  const employerMax = wages * SOLO_401K_2025.employer_share_pct;
  const combinedHeadroom = SOLO_401K_2025.total_combined_limit - employee;
  const employer = Math.max(0, Math.min(employerMax, combinedHeadroom));
  return {
    employee_max: employeeMax,
    employee,
    employer_max: employerMax,
    employer,
    total_max: employeeMax + Math.max(0, Math.min(employerMax, SOLO_401K_2025.total_combined_limit - employeeMax)),
    total: employee + employer,
  };
}

/**
 * CA employer-side payroll taxes (SUI + ETT + FUTA). These are real costs
 * the corporation pays in addition to FICA employer match.
 */
function caEmployerPayrollTaxes(wages) {
  const sui = Math.min(wages, CA_PAYROLL_TAXES_2025.sui_wage_base) * CA_PAYROLL_TAXES_2025.sui_rate_employer;
  const ett = Math.min(wages, CA_PAYROLL_TAXES_2025.ett_wage_base) * CA_PAYROLL_TAXES_2025.ett_rate_employer;
  const futa = Math.min(wages, CA_PAYROLL_TAXES_2025.futa_wage_base) * CA_PAYROLL_TAXES_2025.futa_rate;
  return { sui, ett, futa, total: sui + ett + futa };
}

/**
 * CA SDI on wages (employee-side, deducted from paycheck).
 */
function caSDI(wages) {
  return wages * CA_PAYROLL_TAXES_2025.sdi_rate_employee;
}

/**
 * Heuristic audit-risk rating for a non-producing manager.
 * Salary as a percentage of S-corp net (before salary) is the dominant
 * factor in IRS reasonable-comp scrutiny.
 */
function auditRiskRating(salary, netBeforeSalary, role) {
  if (netBeforeSalary <= 0) return { level: 'unknown', label: 'Insufficient data', color: 'var(--ink-3)' };
  const pct = salary / netBeforeSalary;
  // Non-producing manager benchmarks (more flexibility than producing role)
  if (role === 'non_producing_manager') {
    if (pct < 0.20) return { level: 'high', label: 'Likely too low for audit defense', color: 'var(--danger)', pct };
    if (pct < 0.30) return { level: 'moderate', label: 'Defensible but could draw scrutiny', color: 'var(--warn)', pct };
    if (pct < 0.50) return { level: 'low', label: 'Solidly defensible', color: 'var(--accent-2)', pct };
    return { level: 'minimal', label: 'Conservative — over-paying FICA', color: 'var(--ink-3)', pct };
  }
  // Producing LO — needs higher salary because origination work is comp-comparable
  if (pct < 0.30) return { level: 'high', label: 'Likely too low for an LO role', color: 'var(--danger)', pct };
  if (pct < 0.40) return { level: 'moderate', label: 'Borderline for producing role', color: 'var(--warn)', pct };
  if (pct < 0.60) return { level: 'low', label: 'Solidly defensible', color: 'var(--accent-2)', pct };
  return { level: 'minimal', label: 'Conservative — over-paying FICA', color: 'var(--ink-3)', pct };
}

/**
 * Run the full comp scenario calculation for a given salary.
 * Returns every line item the UI needs.
 */
function computeCompScenario({ salary, scorpNet, filingStatus, role, employeeDeferralTarget, marginalCombinedRate }) {
  // FICA on W-2 wages
  const fica = ficaOnWages(salary, filingStatus);
  // CA employer-side payroll taxes
  const caEmployer = caEmployerPayrollTaxes(salary);
  // Employee-side SDI (deducted from paycheck)
  const sdi = caSDI(salary);

  // K-1 = scorpNet − salary − employer-side payroll taxes
  // (employer FICA + CA SUI + ETT + FUTA all reduce S-corp net before K-1 flows to owner)
  const employerCost = fica.employer + caEmployer.total;
  const k1 = Math.max(0, scorpNet - salary - employerCost);

  // Solo 401(k) capacity at this salary level
  const retirement = solo401kCapacity(salary, employeeDeferralTarget);

  // The retirement deduction "saves" tax at marginal rate. Employee deferral
  // is pre-tax against fed+CA income (W-2 reduction). Employer profit-share
  // is a corp deduction reducing K-1.
  const retirementTaxBenefit = retirement.total * marginalCombinedRate;

  // Total cost to the household = FICA both halves + CA employer payroll + SDI
  // (income tax is approximately neutral between salary and K-1, ignoring QBI
  // edge cases which we surface elsewhere)
  const totalPayrollCost = fica.total + caEmployer.total + sdi;

  // Net after retirement tax shield — what really matters
  const effectivePayrollCost = totalPayrollCost - retirementTaxBenefit;

  return {
    salary,
    k1,
    fica,
    caEmployer,
    sdi,
    employerCost,
    retirement,
    retirementTaxBenefit,
    totalPayrollCost,
    effectivePayrollCost,
    auditRisk: auditRiskRating(salary, scorpNet, role),
    salaryToNetPct: scorpNet > 0 ? salary / scorpNet : 0,
  };
}

/**
 * Find the salary that minimizes effectivePayrollCost subject to:
 *  - Audit-risk floor (minimum salary as % of net for the role)
 *  - User's retirement target (the salary needs to support employee deferral
 *    plus enough employer profit-share to get to the target if specified)
 */
function recommendSalary({ scorpNet, filingStatus, role, employeeDeferralTarget, marginalCombinedRate, employerTarget }) {
  // Floor based on role
  const floorPct = role === 'non_producing_manager' ? 0.30 : 0.40;
  const floor = Math.round(scorpNet * floorPct / 1000) * 1000;

  // If user wants an employer profit-share target, salary must be at least 4x that
  // (since employer share is capped at 25% of wages)
  const employerFloor = employerTarget ? Math.ceil(employerTarget / 0.25 / 1000) * 1000 : 0;

  // The recommendation is the higher of the two floors, but capped so salary
  // doesn't exceed 60% of net (over-paying FICA without benefit)
  const ceiling = Math.round(scorpNet * 0.60 / 1000) * 1000;
  const recommendation = Math.min(ceiling, Math.max(floor, employerFloor));

  return {
    floor,
    employerFloor,
    ceiling,
    recommendation,
  };
}

/* =========================================================================

   ========================================================================= */
function renderCompOptimizer(root) {
  const s = state.settings;
  const filingStatus = s.tax_filing_status || 'mfj';
  const role = s.comp_owner_role || 'non_producing_manager';
  const marginalRate = Number(s.comp_marginal_combined) || 0.33;
  const targetDeferral = Number(s.comp_target_401k) || SOLO_401K_2025.employee_deferral_limit;
  const currentSalary = Number(s.tax_reasonable_salary) || 90000;

  // Pull projected S-corp net from transaction data, allow override
  const figures = getCurrentYearTaxFigures();
  const projectedNetFromData = figures.projectedAnnualNet;
  const overrideNet = Number(s.comp_overrides_net) || 0;
  const scorpNet = overrideNet > 0 ? overrideNet : projectedNetFromData;

  // If we have no data and no override, prompt setup
  if (scorpNet <= 0) {
    root.innerHTML = `
      ${renderBrandBand({
        eyebrow: 'Owner compensation',
        title: 'Salary vs distributions optimizer',
      })}
      <div class="card empty">
        <h3>No income data yet.</h3>
        <p>Import transactions or set a manual S-corp net projection in <a href="#" onclick="navigate('settings');return false;">Settings → Tax profile</a>.</p>
      </div>`;
    return;

  // Three anchored scenarios sized to actual net
  // For non-producing manager netting $X, anchors: 30% / 50% / 67%
  const anchorPcts = role === 'non_producing_manager' ? [0.39, 0.50, 0.67] : [0.40, 0.55, 0.70];
  const scenarios = anchorPcts.map(pct => {
    const salary = Math.round(scorpNet * pct / 1000) * 1000;
    return computeCompScenario({
      salary, scorpNet, filingStatus, role,
      employeeDeferralTarget: targetDeferral,
      marginalCombinedRate: marginalRate,

    salary: currentSalary, scorpNet, filingStatus, role,

    marginalCombinedRate: marginalRate,
  });

  // Recommendation
  const recEmployerTarget = Math.max(0, SOLO_401K_2025.total_combined_limit - targetDeferral);

    scorpNet, filingStatus, role,
    employeeDeferralTarget: targetDeferral,
    marginalCombinedRate: marginalRate,

  const dataSource = overrideNet > 0

            ${fmt.money(rec.recommendation, {absolute:true})}

            ${role === 'non_producing_manager' ? `For a non-producing manager, the IRS reasonable-comp floor sits around 30% of net. ` : `For a producing-LO role, the floor sits around 40% of net. `}
            ${recEmployerTarget > 0 ? `To unlock ${fmt.money(recEmployerTarget, {absolute:true})} of employer 401(k) profit-share (your target combined contribution), salary needs to be at least ${fmt.money(rec.employerFloor, {absolute:true})}. ` : ''}
            The recommendation balances audit defensibility against FICA cost and retirement room.

        const isRec = Math.abs(sc.salary - rec.recommendation) < 5000;

                <tr><td style="padding:3px 0;color:var(--ink-3)" class="tiny">Employer share max (25%)</td><td class="num" style="font-family:var(--mono);text-align:right;font-size:11.5px">${fmt.money(sc.retirement.employer_max, {absolute:true})}</td></tr>

      <p style="margin-top:10px"><strong>Documentation matters more than the number.</strong> A $90K salary with a written job description, time logs, and comparable-comp research is far more defensible than a $120K salary with no documentation. If audited, you defend the methodology, not the dollar amount.</p>

/* =========================================================================
   TAX STRATEGY MODULE
   Evaluates and recommends tax-reduction strategies for a non-producing
   S-corp owner-manager in California. Pure functions for the math; the
   view (renderTaxStrategy) consumes them.

   Strategies covered:
     1. Solo 401(k) — employee + employer contributions
     2. HSA — health savings account (with the >2% S-corp owner caveats)
     3. S-corp self-employed health insurance (SEHI) — W-2 box 1 treatment
     4. Reasonable comp review — surface current salary's risk rating
   ========================================================================= */

const HSA_LIMITS_2025 = {
  self: 4300,
  family: 8550,
  catchup_55: 1000,
};

/**
 * Pull together the user's current tax situation. Used by the strategy
 * dashboard and as the baseline for scenario modeling.
 */
function buildTaxStrategyInputs() {
  const s = state.settings;
  const filing = s.tax_filing_status || 'mfj';
  const role = s.comp_owner_role || 'non_producing_manager';
  const marginalRate = Number(s.comp_marginal_combined) || 0.33;
  const currentSalary = Number(s.tax_reasonable_salary) || 0;

  // Projected S-corp net (before owner W-2)
  const figures = getCurrentYearTaxFigures();
  const overrideNet = Number(s.comp_overrides_net) || 0;
  const scorpNet = overrideNet > 0 ? overrideNet : figures.projectedAnnualNet;

  // Solo 401(k)
  const employeeYTD = Number(s.strat_401k_employee_ytd) || 0;
  const employerYTD = Number(s.strat_401k_employer_ytd) || 0;
  const target401k = Number(s.strat_401k_target_total) || 0;

  // HSA
  const hsaEligible = s.strat_hsa_eligible === 'yes';
  const hsaCoverage = s.strat_hsa_coverage || 'self';
  const hsa55Plus = !!s.strat_hsa_age_55_plus;
  const hsaYTD = Number(s.strat_hsa_contributed_ytd) || 0;
  const hsaTarget = Number(s.strat_hsa_target) || 0;

  // SEHI
  const sehiPremium = Number(s.strat_sehi_premium_annual) || 0;
  const sehiInW2 = s.strat_sehi_in_w2_box1 === 'yes';
  const sehiDeducted = s.strat_sehi_deducted_on_1040 === 'yes';

  return {
    filing, role, marginalRate, currentSalary, scorpNet,
    employeeYTD, employerYTD, target401k,
    hsaEligible, hsaCoverage, hsa55Plus, hsaYTD, hsaTarget,
    sehiPremium, sehiInW2, sehiDeducted,
  };
}

/**
 * Solo 401(k) analysis at the user's current salary.
 * Returns capacity, current YTD, target, recommended amount, tax savings.
 */
function analyze401k(inputs) {
  const { currentSalary, employeeYTD, employerYTD, target401k, marginalRate } = inputs;
  const capacity = solo401kCapacity(currentSalary, SOLO_401K_2025.employee_deferral_limit);
  const contributedYTD = employeeYTD + employerYTD;
  const totalMax = Math.min(SOLO_401K_2025.total_combined_limit, capacity.employee_max + capacity.employer_max);
  const remainingCapacity = Math.max(0, totalMax - contributedYTD);

  // Recommendation: contribute up to target if set, otherwise up to total max
  const recommended = target401k > 0
    ? Math.max(0, Math.min(target401k, totalMax) - contributedYTD)
    : remainingCapacity;

  // Tax savings: every dollar contributed pre-tax saves marginal rate
  // (Employee deferral is pre-tax against W-2 → reduces fed+CA income tax,
  // not FICA. Employer share is a corp deduction → reduces K-1 → same effect.)
  const savingsRecommended = recommended * marginalRate;
  const savingsAtMax = totalMax * marginalRate;
  const savingsCurrentYTD = contributedYTD * marginalRate;

  return {
    employeeMax: capacity.employee_max,
    employerMax: capacity.employer_max,
    totalMax,
    contributedYTD,
    remainingCapacity,
    recommended,
    savingsRecommended,
    savingsAtMax,
    savingsCurrentYTD,
    progressPct: totalMax > 0 ? Math.min(1, contributedYTD / totalMax) : 0,
  };
}

/**
 * HSA analysis. Note the >2% S-corp owner caveat: contributions can't go
 * through payroll pre-tax. They're personal contributions deducted on 1040.
 */
function analyzeHSA(inputs) {
  const { hsaEligible, hsaCoverage, hsa55Plus, hsaYTD, hsaTarget, marginalRate } = inputs;
  if (!hsaEligible) {
    return {
      eligible: false,
      reason: 'Requires HDHP enrollment with no disqualifying coverage. Confirm in settings.',
    };
  }
  const limit = HSA_LIMITS_2025[hsaCoverage] + (hsa55Plus ? HSA_LIMITS_2025.catchup_55 : 0);
  const remainingCapacity = Math.max(0, limit - hsaYTD);
  const recommended = hsaTarget > 0
    ? Math.max(0, Math.min(hsaTarget, limit) - hsaYTD)
    : remainingCapacity;
  const savingsRecommended = recommended * marginalRate;
  const savingsAtMax = limit * marginalRate;
  const savingsCurrentYTD = hsaYTD * marginalRate;

  return {
    eligible: true,
    coverage: hsaCoverage,
    age55Plus: hsa55Plus,
    limit,
    contributedYTD: hsaYTD,
    remainingCapacity,
    recommended,
    savingsRecommended,
    savingsAtMax,
    savingsCurrentYTD,
    progressPct: limit > 0 ? Math.min(1, hsaYTD / limit) : 0,
    notes: [
      '>2% S-corp owners cannot fund HSAs pre-tax through payroll. Contribute personally; deduct on Form 1040 Schedule 1.',
      'Triple tax-advantaged: pre-tax in, tax-free growth, tax-free out for qualified medical expenses.',
      'Long-term reimbursement strategy: pay medical expenses out of pocket, save receipts, reimburse yourself from the HSA decades later (no time limit on reimbursement).',
    ],
  };
}

/**
 * S-corp health insurance diagnostic. Doesn't compute "savings" since this
 * is a compliance check, not an optimization.
 */
function analyzeSEHI(inputs) {
  const { sehiPremium, sehiInW2, sehiDeducted, currentSalary, marginalRate } = inputs;
  if (sehiPremium === 0) {
    return {
      status: 'not_applicable',
      message: 'No S-corp-paid health insurance recorded. If your corp pays your health insurance, enter the annual premium in settings.',
    };
  }

  const issues = [];
  let status = 'compliant';

  if (!sehiInW2) {
    issues.push({
      severity: 'high',
      label: 'Premium not in W-2 Box 1',
      detail: `If your S-corp pays your health insurance, the annual premium (${fmt.money(sehiPremium, {absolute:true})}) must be added to Box 1 of your W-2. It's NOT subject to FICA (not in Box 3 or 5). Skipping this is a payroll compliance error.`,
    });
    status = 'non_compliant';
  }
  if (!sehiDeducted) {
    issues.push({
      severity: 'medium',
      label: 'Not deducted on personal 1040',
      detail: `After adding ${fmt.money(sehiPremium, {absolute:true})} to W-2 Box 1, deduct the same amount as self-employed health insurance on Form 1040 Schedule 1. Net effect: corp deducts the premium, you don't owe FICA on it, and your personal income tax is unaffected.`,
    });
    if (status === 'compliant') status = 'incomplete';
  }

  // If correctly handled, surface the FICA savings vs not running it through the corp
  const ficaSavings = sehiInW2 ? sehiPremium * 0.153 : 0;

  return {
    status,
    annualPremium: sehiPremium,
    issues,
    ficaSavings,
    notes: status === 'compliant'
      ? ['Health insurance is being handled correctly. The corp pays the premium → adds it to Box 1 → you deduct it on Schedule 1.']
      : ['Talk to your CPA about correcting this before year-end. The W-2 needs to reflect the SEHI add-back, and your 1040 should claim the deduction.'],
  };
}

/**
 * Reasonable compensation review. Pulls from the Owner Comp engine.
 */
function analyzeReasonableComp(inputs) {
  const { currentSalary, scorpNet, role } = inputs;
  const risk = auditRiskRating(currentSalary, scorpNet, role);
  const salaryPct = scorpNet > 0 ? currentSalary / scorpNet : 0;
  return {
    salary: currentSalary,
    scorpNet,
    salaryPct,
    risk,
    role,
  };
}

/**
 * Compute the current year's complete tax picture for the strategy
 * dashboard. Differs from estTax in that it pulls together salary + K-1
 * + contributions and shows total tax owed across all categories.
 */
function computeStrategyTaxSummary(inputs) {
  const { currentSalary, scorpNet, filing, employeeYTD, employerYTD, hsaYTD, sehiPremium, sehiInW2 } = inputs;

  // FICA on salary (both halves — corp pays employer half, reduces K-1)
  const fica = ficaOnWages(currentSalary, filing);
  // CA payroll taxes (employer-side)
  const caPayroll = caEmployerPayrollTaxes(currentSalary);
  // CA SDI (employee-side)
  const sdi = caSDI(currentSalary);

  // K-1 = scorpNet - salary - employer payroll - sehi (deductible at corp level)
  const sehiAddBack = sehiInW2 ? sehiPremium : 0;  // Conservative: only add to wages if user confirms
  const k1 = Math.max(0, scorpNet - currentSalary - fica.employer - caPayroll.total - sehiPremium);

  // Federal income tax on the 1040 — W-2 wages + K-1 income - 401(k) employee deferral - HSA - SEHI deduction
  // (Standard deduction applies, QBI may apply but phases out for SSTB)
  const grossIncome = currentSalary + k1 + sehiAddBack; // SEHI added back to W-2 wages
  const aboveLineDeductions = employeeYTD + hsaYTD + sehiAddBack; // SEHI is also deducted, so it's neutral on AGI
  const agi = grossIncome - aboveLineDeductions;
  const stdDeduction = FED_STD_DEDUCTION_2025[filing] || FED_STD_DEDUCTION_2025.mfj;
  const taxableIncome = Math.max(0, agi - stdDeduction);
  const fedIncomeTax = applyBrackets(FED_BRACKETS_2025[filing] || FED_BRACKETS_2025.mfj, taxableIncome);

  // California income tax (no standard deduction adjustment needed here; CA largely conforms for these items)
  const caStdDed = CA_STD_DEDUCTION_2024[filing] || CA_STD_DEDUCTION_2024.mfj;
  const caTaxable = Math.max(0, agi - caStdDed);
  const caIncomeTax = applyBrackets(CA_BRACKETS_2024[filing] || CA_BRACKETS_2024.mfj, caTaxable);

  // Total payroll tax (FICA both halves + CA SUI/ETT/FUTA + SDI)
  const totalPayrollTax = fica.total + caPayroll.total + sdi;

  // Grand total tax burden
  const totalTax = fedIncomeTax + caIncomeTax + totalPayrollTax;

  return {
    grossIncome,
    salary: currentSalary,
    k1,
    sehiAddBack,
    aboveLineDeductions,
    agi,
    taxableIncome,
    fedIncomeTax,
    caIncomeTax,
    fica,
    caPayroll,
    sdi,
    totalPayrollTax,
    totalTax,
    effectiveRate: grossIncome > 0 ? totalTax / grossIncome : 0,
  };
}

  const rHSA = analyzeHSA(inputs);
  const rSEHI = analyzeSEHI(inputs);
