    <!-- HSA card -->
    <div class="card mb-12">
      <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px">

        <div class="cert-block" style="margin-top:14px;font-size:11.5px;padding:14px 18px;line-height:1.6">
          <strong>The long-term play:</strong> Pay current medical expenses out of pocket if you can. Save the receipts. Decades later, you can reimburse yourself tax-free from the HSA — there's no time limit. Meanwhile the HSA invested in index funds grows tax-free. After age 65 you can also withdraw for any purpose (taxed like an IRA), making it effectively a backup retirement account.
        </div>
      </details>

    <!-- SEHI card -->
    <div class="card mb-12">
      <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px">
        <div style="flex:1;min-width:280px">
          <div class="row" style="gap:10px;align-items:center;margin-bottom:6px">
            <div style="width:32px;height:32px;border-radius:6px;background:var(--bg-alt);display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-weight:600;color:var(--navy);font-size:13px">HI</div>
            <div style="font-family:var(--sans);font-size:16px;font-weight:700;color:var(--ink)">S-corp Health Insurance (SEHI)</div>
          </div>
          <p class="muted tiny" style="line-height:1.55;margin:0">If your S-corp pays your health insurance, it must be added to W-2 Box 1 and then deducted on your personal 1040. Done correctly, the corp deducts the premium and you avoid FICA on it.</p>
        </div>
        <div style="text-align:right;min-width:200px">
          ${rSEHI.status === 'compliant' ? `
            <div class="card-eyebrow" style="color:var(--accent-2)">Compliant ✓</div>
            <div class="muted tiny" style="margin-top:4px">FICA savings ${fmt.money(rSEHI.ficaSavings, {absolute:true})}/yr</div>

            <div class="card-eyebrow">Not applicable</div>

            <div class="card-eyebrow" style="color:var(--danger)">Needs attention</div>
          `}

      ${rSEHI.issues && rSEHI.issues.length > 0 ? `

      <details style="margin-top:14px">

          <div class="field">

          <div class="field">

            <select id="strat_sehi_deducted_on_1040">
              <option value="unknown" ${state.settings.strat_sehi_deducted_on_1040==='unknown'?'selected':''}>Not sure</option>
              <option value="yes" ${state.settings.strat_sehi_deducted_on_1040==='yes'?'selected':''}>Yes</option>
              <option value="no" ${state.settings.strat_sehi_deducted_on_1040==='no'?'selected':''}>No</option>

    <!-- Reasonable comp card (summary; full tool lives in Owner Comp) -->
    <div class="card mb-24">

        <div style="flex:1;min-width:280px">

            <div style="width:32px;height:32px;border-radius:6px;background:var(--bg-alt);display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-weight:600;color:var(--navy);font-size:13px">W-2</div>
            <div style="font-family:var(--sans);font-size:16px;font-weight:700;color:var(--ink)">Reasonable Compensation Review</div>
          </div>
          <p class="muted tiny" style="line-height:1.55;margin:0">Salary of ${fmt.money(rComp.salary, {absolute:true})} is ${(rComp.salaryPct*100).toFixed(0)}% of S-corp net (${fmt.money(rComp.scorpNet, {absolute:true})}). For a non-producing manager role, this is <strong style="color:${rComp.risk.color}">${rComp.risk.label.toLowerCase()}</strong>.</p>

          <button class="btn btn-sm" onclick="navigate('comp')">Open Owner Comp →</button>
        </div>
      </div>
    </div>

    <!-- ============ ASSUMPTIONS & METHODOLOGY ============ -->
    <div class="cert-block">
      <h4>Assumptions and what's not modeled</h4>
      <p><strong>What this tool calculates:</strong> Federal income tax via 2025 Form 1040 brackets, California income tax via 2025 540 brackets, FICA and CA payroll tax via current rates, projected K-1 from S-corp net minus salary and employer-side payroll taxes.</p>
      <p style="margin-top:10px"><strong>Not modeled (talk to your CPA):</strong> QBI / 199A deduction (mortgage brokerage is an SSTB — fully phases out above $483K MFJ in 2025, partial phase-in between $383K–$483K). State-specific add-backs. AMT. Net investment income tax (3.8% above $250K MFJ). Estimated tax safe harbor differences. Itemized deduction modeling. Capital gains. Prior year carryforwards.</p>
      <p style="margin-top:10px"><strong>Tax savings estimates use your stated combined marginal rate</strong> (${(inputs.marginalRate*100).toFixed(0)}%). If your actual marginal rate differs, savings figures scale linearly. Adjust marginal rate in Owner Comp.</p>
      <p style="margin-top:10px"><strong>Recommendations are not advice.</strong> Your CPA should sign off on contribution levels, SEHI treatment, and any compensation changes before you act. The tool's job is to surface the math and the compliance posture; the decision is yours.</p>
    </div>
  `;

  // -------- WIRE UP --------
  const wireField = (id, parser) => {
    const el = document.getElementById(id);
    if (el) el.onchange = (e) => {
      const val = parser ? parser(e.target) : e.target.value;
      state.settings[id] = val;
      saveSettings();
      render();
    };
  };
  wireField('strat_401k_employee_ytd', el => parseFloat(el.value) || 0);
  wireField('strat_401k_employer_ytd', el => parseFloat(el.value) || 0);
  wireField('strat_401k_target_total', el => parseFloat(el.value) || 0);
  wireField('strat_hsa_eligible');
  wireField('strat_hsa_coverage');
  wireField('strat_hsa_age_55_plus', el => el.checked);
  wireField('strat_hsa_contributed_ytd', el => parseFloat(el.value) || 0);
  wireField('strat_sehi_premium_annual', el => parseFloat(el.value) || 0);
  wireField('strat_sehi_in_w2_box1');
  wireField('strat_sehi_deducted_on_1040');

  // Scenario button — opens the scenario modal
  const scenarioBtn = document.getElementById('scenarioBtn');
  if (scenarioBtn) scenarioBtn.onclick = () => openScenarioModal(inputs);
}

/* =========================================================================
   SCENARIO MODELING
   Interactive what-if for salary, 401(k), HSA, and SEHI.
   Computes baseline vs scenario side-by-side.
   ========================================================================= */
function openScenarioModal(baseInputs) {
  // Initialize scenario inputs from baseline
  const scenario = {
    salary: baseInputs.currentSalary,
    employee401k: Math.min(baseInputs.employeeYTD + (analyze401k(baseInputs).employeeMax - baseInputs.employeeYTD), SOLO_401K_2025.employee_deferral_limit),
    employer401k: baseInputs.employerYTD,
    hsa: baseInputs.hsaYTD,
    sehi: baseInputs.sehiPremium,
    sehiInW2: baseInputs.sehiInW2,
  };

  const computeScenarioOutput = (sc) => {
    const inp = {
      ...baseInputs,
      currentSalary: sc.salary,
      employeeYTD: sc.employee401k,
      employerYTD: sc.employer401k,
      hsaYTD: sc.hsa,
      sehiPremium: sc.sehi,
      sehiInW2: sc.sehiInW2,
    };
    return computeStrategyTaxSummary(inp);
  };

  const baseline = computeStrategyTaxSummary(baseInputs);
  const renderModal = () => {
    const sc = computeScenarioOutput(scenario);
    const delta = sc.totalTax - baseline.totalTax;

    openModal(`
      <div class="modal-title">Tax scenario modeling</div>
      <div class="muted tiny mt-8 mb-16" style="line-height:1.55">Adjust the levers below. Watch the right column update. The "delta" shows how the scenario changes your total tax burden vs your current setup.</div>

      <div class="grid-2" style="gap:24px">
        <!-- LEFT: levers -->
        <div>
          <div class="section-title">Levers</div>

          <div class="field">
            <label>W-2 salary: <strong>${fmt.money(scenario.salary, {absolute:true})}</strong></label>
            <input type="range" id="scSalary" min="${Math.max(0, Math.round(baseInputs.scorpNet*0.15))}" max="${Math.round(baseInputs.scorpNet*0.80)}" step="1000" value="${scenario.salary}"/>
            <div class="row muted tiny" style="justify-content:space-between">
              <span>${fmt.money(Math.round(baseInputs.scorpNet*0.15), {absolute:true})}</span>
              <span>${(scenario.salary/baseInputs.scorpNet*100).toFixed(0)}% of net</span>
              <span>${fmt.money(Math.round(baseInputs.scorpNet*0.80), {absolute:true})}</span>
            </div>
          </div>

          <div class="field">
            <label>Solo 401(k) employee deferral: <strong>${fmt.money(scenario.employee401k, {absolute:true})}</strong></label>
            <input type="range" id="scEmp401k" min="0" max="${SOLO_401K_2025.employee_deferral_limit}" step="500" value="${scenario.employee401k}"/>
            <div class="row muted tiny" style="justify-content:space-between">
              <span>$0</span>
              <span>Max ${fmt.money(SOLO_401K_2025.employee_deferral_limit, {absolute:true})}</span>
            </div>
          </div>

          <div class="field">
            <label>Solo 401(k) employer profit-share: <strong>${fmt.money(scenario.employer401k, {absolute:true})}</strong></label>
            <input type="range" id="scEr401k" min="0" max="${Math.round(scenario.salary * 0.25)}" step="500" value="${Math.min(scenario.employer401k, Math.round(scenario.salary * 0.25))}"/>
            <div class="row muted tiny" style="justify-content:space-between">
              <span>$0</span>
              <span>25% of salary cap: ${fmt.money(Math.round(scenario.salary * 0.25), {absolute:true})}</span>
            </div>
          </div>

          <div class="field">
            <label>HSA contribution: <strong>${fmt.money(scenario.hsa, {absolute:true})}</strong></label>
            <input type="range" id="scHsa" min="0" max="${HSA_LIMITS_2025.family + HSA_LIMITS_2025.catchup_55}" step="100" value="${scenario.hsa}"/>
            <div class="muted tiny">Limit depends on coverage (self $4,300, family $8,550 + $1K catch-up at 55+)</div>
          </div>

          <div class="field">
            <label>S-corp health insurance premium: <strong>${fmt.money(scenario.sehi, {absolute:true})}</strong></label>
            <input type="range" id="scSehi" min="0" max="50000" step="500" value="${scenario.sehi}"/>
            <div class="field">
              <label class="row" style="cursor:pointer;margin-top:8px">
                <input type="checkbox" id="scSehiInW2" ${scenario.sehiInW2 ? 'checked' : ''}/>
                <span class="tiny">Properly handled (added to W-2 Box 1, deducted on 1040)</span>
              </label>
            </div>
          </div>

          <button class="btn btn-sm btn-ghost mt-12" id="scResetBtn">Reset to current</button>
        </div>

        <!-- RIGHT: comparison -->
        <div>
          <div class="section-title">Comparison</div>

          <div style="background:var(--bg-alt);padding:18px 22px;border-radius:6px;margin-bottom:14px">
            <div class="row" style="justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px">
              <div>
                <div class="card-eyebrow">Scenario total tax</div>
                <div style="font-family:var(--sans);font-size:26px;font-weight:600;color:var(--navy);letter-spacing:-0.01em;font-variant-numeric:tabular-nums">${fmt.money(sc.totalTax, {absolute:true})}</div>
                <div class="muted tiny mt-2">Baseline: ${fmt.money(baseline.totalTax, {absolute:true})}</div>
              </div>
              <div style="text-align:right">
                <div class="card-eyebrow">Delta</div>
                <div style="font-family:var(--sans);font-size:22px;font-weight:600;color:${delta < 0 ? 'var(--accent-2)' : delta > 0 ? 'var(--danger)' : 'var(--ink-3)'};font-variant-numeric:tabular-nums">${delta === 0 ? '$0' : (delta < 0 ? '−' : '+') + fmt.money(Math.abs(delta), {absolute:true})}</div>

      scenario.sehiInW2 = baseInputs.sehiInW2;

    };
  };

  renderModal();
}

/* =========================================================================
   PAYROLL RUNNER
   Owner-only S-corp monthly payroll for California.

   Implements:
   - Federal income tax via IRS Pub 15-T 2025 monthly tables (Form W-4 from
     2020 or later). Standard withholding method, Step 2 unchecked or checked.
   - FICA: 6.2% Social Security up to $176,100 + 1.45% Medicare + 0.9%
     additional Medicare above $200K cumulative wages.
   - California PIT via DE 44 2025 monthly tables.
   - California SDI 1.1% with no wage cap.
   - Employer-side: SS match 6.2%, Medicare match 1.45%, FUTA 0.6% on first
     $7K, CA SUI (employer's rate, default 3.4%) on first $7K, CA ETT 0.1%
     on first $7K.

   Pure functions for math; UI just renders. Each pay period generates a
   "paystub" object with every line item, plus three deposit instructions:
     1. Net pay → owner's personal account
     2. Federal payroll tax → EFTPS
     3. California payroll tax → EDD e-Services for Business
   ========================================================================= */

/**
 * IRS Publication 15-T (2025) — Monthly payroll period, Form W-4 from 2020+.
 * STANDARD withholding rate schedule (Step 2 of W-4 unchecked).
 *
 * Each entry: [over_amount, base_tax, marginal_rate]
 * Tax = base_tax + (annual_wages_after_adjustments - over_amount) * marginal_rate
 * Then divided by 12 for monthly tax.
 *
 * Source: IRS Pub 15-T 2025, Worksheet 1A, "Annual Payroll Period — Standard"
 */
const FED_PUB15T_2025 = {
  // Married Filing Jointly
  mfj: [
    [0,        0,        0.00],   // $0 - $17,100
    [17100,    0,        0.10],   // $17,100 - $40,950
    [40950,    2385,     0.12],   // ...
    [113550,   11157,    0.22],
    [223900,   35421,    0.24],
    [411800,   83317,    0.32],
    [517750,   117267,   0.35],
    [768700,   205050,   0.37],
  ],
  // Single or Married Filing Separately
  single: [
    [0,        0,        0.00],
    [6400,     0,        0.10],
    [18325,    1192.50,  0.12],
    [54625,    5578.50,  0.22],
    [109750,   17710.50, 0.24],
    [203700,   40258.50, 0.32],
    [256650,   57231.00, 0.35],
    [632150,   188598.0, 0.37],
  ],
  // Head of Household
  hoh: [
    [0,        0,        0.00],
    [13900,    0,        0.10],
    [30900,    1700,     0.12],
    [78750,    7442,     0.22],
    [117250,   15912,    0.24],
    [211200,   38460,    0.32],
    [264150,   55404,    0.35],
    [639700,   186793.50, 0.37],
  ],
};

/* California DE 44 (2025) — Method B Exact Calculation Method.
   Annualized brackets, then divided by pay periods. Tax credits per
   allowance applied at the end. */
const CA_DE44_2025 = {
  mfj: [
    [0,         0,         0.011],   // $0 - $21,512
    [21512,     236.63,    0.022],   // ...
    [50998,     885.32,    0.044],

    [1442628,   154248.98, 0.1353],
    [9999999,   2068066.26, 0.1453], // 1% mental health surtax above $1M (combined)
  ],
  single: [
    [0,        0,         0.011],
    [10756,    118.32,    0.022],
    [25499,    442.66,    0.044],
    [40245,    1091.49,   0.066],
    [55866,    2122.47,   0.088],
    [70606,    3419.59,   0.1023],
    [360659,   33090.01,  0.1133],
    [432787,   41258.42,  0.1243],
    [721314,   77124.49,  0.1353],
    [9999999,  1334033.13, 0.1453],
  ],
  hoh: [
    [0,        0,         0.011],
    [21527,    236.80,    0.022],
    [51000,    885.20,    0.044],
    [65744,    1533.94,   0.066],
    [81364,    2564.86,   0.088],
    [96107,    3862.24,   0.1023],
    [490493,   44219.65,  0.1133],
    [588593,   55330.78,  0.1243],
    [980987,   104108.78, 0.1353],
    [9999999,  1404049.09, 0.1453],
  ],
};

/** California DE 44 standard deduction (annual) by filing status, 2025 */
const CA_STD_DEDUCTION_PAYROLL_2025 = {
  single: 5540, mfj: 11080, hoh: 11080, mfs: 5540,
};

/** California DE 44 personal allowance credit (annual) — applied at end */
const CA_PERSONAL_ALLOWANCE_CREDIT_2025 = 154.00; // Per allowance

/**
 * Federal income tax withholding for ONE pay period using Pub 15-T
 * Worksheet 1A (Annual Payroll Period — Standard).
 *
 * Following the IRS 4-step process:
 *   1. Compute annualized wages (gross × pay periods)
 *   2. Subtract step-4(b) deductions
 *   3. If multiple jobs box NOT checked, subtract $12,900 (MFJ) or $8,600 (other)
 *   4. Apply bracket table → annual tax
 *   5. Subtract step-3 dependent credit
 *   6. Divide by pay periods → per-period tax
 *   7. Add step-4(c) extra withholding
 */
function fedWithholdingPerPeriod({ grossPerPeriod, payPeriods, w4 }) {
  const annualWages = grossPerPeriod * payPeriods;
  // Step-4(b) deductions reduce annualized wages
  const adjusted1 = annualWages - (w4.deductions || 0);
  // If multiple-jobs box NOT checked, reduce by standard amount
  const standardReduction = w4.multipleJobs ? 0
    : (w4.filingStatus === 'mfj' ? 12900 : 8600);
  const adjusted2 = adjusted1 - standardReduction;

  // Apply brackets
  const brackets = FED_PUB15T_2025[w4.filingStatus] || FED_PUB15T_2025.mfj;
  let annualTax = 0;
  for (let i = brackets.length - 1; i >= 0; i--) {
    const [over, base, rate] = brackets[i];
    if (adjusted2 > over) {
      annualTax = base + (adjusted2 - over) * rate;
      break;
    }
  }
  annualTax = Math.max(0, annualTax);
  // Step-3 dependent credits reduce annual tax
  annualTax = Math.max(0, annualTax - (w4.dependents || 0));
  // Per-period
  const perPeriod = annualTax / payPeriods;
  // Add step-4(c) extra withholding
  return Math.max(0, perPeriod + (w4.extraWithhold || 0));
}

/**
 * California PIT withholding for ONE pay period using DE 44 Method B.
 * Steps:
 *   1. Annualized wages
 *   2. Subtract estimated deductions (1 allowance × $1,000 if not itemized)
 *      — for owner-only, default to standard deduction subtraction
 *   3. Subtract std deduction
 *   4. Apply DE 44 brackets → annual tax
 *   5. Subtract personal allowance credit
 *   6. Divide by pay periods
 *   7. Add additional withholding
 */
function caWithholdingPerPeriod({ grossPerPeriod, payPeriods, de4 }) {
  const annualWages = grossPerPeriod * payPeriods;
  const stdDed = CA_STD_DEDUCTION_PAYROLL_2025[de4.filingStatus] || CA_STD_DEDUCTION_PAYROLL_2025.mfj;
  const taxableAnnual = Math.max(0, annualWages - stdDed);

  const brackets = CA_DE44_2025[de4.filingStatus] || CA_DE44_2025.mfj;
  let annualTax = 0;
  for (let i = brackets.length - 1; i >= 0; i--) {
    const [over, base, rate] = brackets[i];
    if (taxableAnnual > over) {
      annualTax = base + (taxableAnnual - over) * rate;
      break;
    }
  }
  // Subtract allowance credits
  const allowanceCredit = (de4.allowances || 0) * CA_PERSONAL_ALLOWANCE_CREDIT_2025;
  annualTax = Math.max(0, annualTax - allowanceCredit);

  const perPeriod = annualTax / payPeriods;
  return Math.max(0, perPeriod + (de4.extraWithhold || 0));
}

/**
 * Generate a complete paystub for one pay period.
 * @param {object} input
 *   annualSalary, payPeriods, periodNumber (1-N for the year),
 *   ytdGrossBefore (gross paid in earlier periods this year, for SS cap & addl Medicare)
 *   w4 = { filingStatus, multipleJobs, dependents, otherIncome, deductions, extraWithhold }
 *   de4 = { filingStatus, allowances, extraWithhold }
 *   caSuiRate (employer's actual rate)
 */
function runPayroll(input) {
  const { annualSalary, payPeriods, periodNumber, ytdGrossBefore, w4, de4, caSuiRate } = input;
  const grossPerPeriod = annualSalary / payPeriods;
  const ytdGrossAfter = ytdGrossBefore + grossPerPeriod;

  // ---- FEDERAL INCOME TAX ----
  const fedIncomeTax = fedWithholdingPerPeriod({ grossPerPeriod, payPeriods, w4 });

  // ---- FICA — Social Security (employee + employer) ----
  // Capped at SS wage base. Need YTD-aware calc.
  const ssWageBase = FICA_2025.ss_wage_base;
  const ssApplicableThisPeriod = Math.max(0, Math.min(grossPerPeriod, ssWageBase - ytdGrossBefore));
  const ssEmployee = ssApplicableThisPeriod * FICA_2025.ss_rate_employee;
  const ssEmployer = ssApplicableThisPeriod * FICA_2025.ss_rate_employer;

  // ---- Medicare (employee + employer, no cap) + Additional Medicare ----
  const medicareEmployee = grossPerPeriod * FICA_2025.medicare_rate_employee;
  const medicareEmployer = grossPerPeriod * FICA_2025.medicare_rate_employer;
  // Additional Medicare 0.9% on YTD wages above $200K threshold (single payer threshold —
  // employer must withhold once any employee crosses $200K regardless of filing status)
  const addlMedThreshold = 200000;
  const addlMedThisPeriod = ytdGrossAfter > addlMedThreshold
    ? (ytdGrossAfter - Math.max(addlMedThreshold, ytdGrossBefore)) * FICA_2025.addl_medicare_rate
    : 0;

  // ---- CA SDI (employee only, no cap as of 2024) ----
  const caSDI = grossPerPeriod * CA_PAYROLL_TAXES_2025.sdi_rate_employee;

  // ---- CA PIT ----
  const caPIT = caWithholdingPerPeriod({ grossPerPeriod, payPeriods, de4 });

  // ---- Employer-side: FUTA, CA SUI, CA ETT (capped at $7K each) ----
  const futaApplicable = Math.max(0, Math.min(grossPerPeriod, CA_PAYROLL_TAXES_2025.futa_wage_base - ytdGrossBefore));
  const futa = futaApplicable * CA_PAYROLL_TAXES_2025.futa_rate;
  const suiApplicable = Math.max(0, Math.min(grossPerPeriod, CA_PAYROLL_TAXES_2025.sui_wage_base - ytdGrossBefore));
  const caSUI = suiApplicable * (caSuiRate || CA_PAYROLL_TAXES_2025.sui_rate_employer);
  const caETT = suiApplicable * CA_PAYROLL_TAXES_2025.ett_rate_employer;

  // ---- Totals ----
  const employeeWithheld = fedIncomeTax + ssEmployee + medicareEmployee + addlMedThisPeriod + caSDI + caPIT;
  const netPay = grossPerPeriod - employeeWithheld;

  // Federal deposit (EFTPS): FIT + SS both halves + Medicare both halves + Addl Medicare
  const fedDepositTotal = fedIncomeTax + ssEmployee + ssEmployer + medicareEmployee + medicareEmployer + addlMedThisPeriod;
  // California deposit (EDD): CA PIT + CA SDI + CA SUI + CA ETT
  const caDepositTotal = caPIT + caSDI + caSUI + caETT;

  // Employer's all-in cost for this paycheck
  const employerAllIn = grossPerPeriod + ssEmployer + medicareEmployer + futa + caSUI + caETT;

  return {
    period: periodNumber,
    grossPerPeriod,
    ytdGrossBefore,
    ytdGrossAfter,
    employee: {
      fedIncomeTax,
      ssEmployee,
      medicareEmployee,
      addlMedicare: addlMedThisPeriod,
      caPIT,
      caSDI,
      totalWithheld: employeeWithheld,
    },
    employer: {
      ssEmployer,
      medicareEmployer,
      futa,
      caSUI,
      caETT,
      total: ssEmployer + medicareEmployer + futa + caSUI + caETT,
    },
    netPay,
    deposits: {
      netToOwner: netPay,
      federal: fedDepositTotal,    // → EFTPS
      california: caDepositTotal,  // → EDD e-Services
    },
    employerAllInCost: employerAllIn,
  };
}

/**
 * Run all 12 monthly payroll periods for a year, accumulating YTD totals.
 * Returns array of paystubs and YTD running totals.
 */
function runFullYearPayroll({ annualSalary, w4, de4, caSuiRate }) {
  const payPeriods = 12;
  const stubs = [];
  let ytdGrossBefore = 0;
  for (let p = 1; p <= payPeriods; p++) {
    const stub = runPayroll({
      annualSalary, payPeriods, periodNumber: p,
      ytdGrossBefore, w4, de4, caSuiRate,
    });
    stubs.push(stub);
    ytdGrossBefore = stub.ytdGrossAfter;
  }
  // YTD totals
  const ytd = stubs.reduce((acc, s) => ({
    gross: acc.gross + s.grossPerPeriod,
    fedIncomeTax: acc.fedIncomeTax + s.employee.fedIncomeTax,
    ssEmployee: acc.ssEmployee + s.employee.ssEmployee,
    ssEmployer: acc.ssEmployer + s.employer.ssEmployer,
    medicareEmployee: acc.medicareEmployee + s.employee.medicareEmployee,
    medicareEmployer: acc.medicareEmployer + s.employer.medicareEmployer,
    addlMedicare: acc.addlMedicare + s.employee.addlMedicare,
    caPIT: acc.caPIT + s.employee.caPIT,
    caSDI: acc.caSDI + s.employee.caSDI,
    caSUI: acc.caSUI + s.employer.caSUI,
    caETT: acc.caETT + s.employer.caETT,
    futa: acc.futa + s.employer.futa,
    netPay: acc.netPay + s.netPay,
    fedDeposit: acc.fedDeposit + s.deposits.federal,
    caDeposit: acc.caDeposit + s.deposits.california,
  }), {
    gross:0, fedIncomeTax:0, ssEmployee:0, ssEmployer:0, medicareEmployee:0,
    medicareEmployer:0, addlMedicare:0, caPIT:0, caSDI:0, caSUI:0, caETT:0,
    futa:0, netPay:0, fedDeposit:0, caDeposit:0,
  });
  return { stubs, ytd };
}

/* ----- Payroll run persistence ----- */
function getPayrollRuns() {
  return Store.get('bxp.payroll_runs', []);
}
function savePayrollRuns(runs) {
  Store.set('bxp.payroll_runs', runs);
}
function logPayrollRun(run) {
  const runs = getPayrollRuns();
  runs.push({
    id: 'pr_' + Math.random().toString(36).slice(2, 10),
    status: 'complete',           // legacy default; new in-progress runs override
    ...run,
    created_at: new Date().toISOString(),
  });
  savePayrollRuns(runs);
}
function findPayrollRun({ month, year }) {
  return getPayrollRuns().find(r => {
    if (r.month === month && String(r.year) === String(year)) return true;
    const [y, m] = (r.payDate || '').split('-').map(Number);
    return y === parseInt(year, 10) && m === month;
  });
}
function updatePayrollRun(id, patch) {
  const runs = getPayrollRuns();
  const i = runs.findIndex(r => r.id === id);
  if (i < 0) return null;
  runs[i] = { ...runs[i], ...patch, updated_at: new Date().toISOString() };
  savePayrollRuns(runs);
  return runs[i];
}
function deletePayrollRun(id) {
  savePayrollRuns(getPayrollRuns().filter(r => r.id !== id));
  // Also remove any associated completion records
  const c = getCompletions();
  for (const key of Object.keys(c)) {
    if (c[key]?.payroll_run_id === id) delete c[key];
  }
  saveCompletions(c);
}

/** Compute overall status of a payroll run from its sub-completions. */
function payrollRunStatus(run) {
  if (!run) return 'not_started';
  const monthStr = run.payDate ? run.payDate.slice(0, 7) : `${run.year}-${String(run.month).padStart(2,'0')}`;
  const netDone = !!getCompletion(`net_transfer:${monthStr}`)?.complete;
  const fedDone = !!getCompletion(`fed_deposit:${monthStr}`)?.complete;
  const caDone = !!getCompletion(`ca_deposit:${monthStr}`)?.complete;
  const stepsDone = [netDone, fedDone, caDone].filter(Boolean).length;
  if (stepsDone === 3) return 'complete';
  if (stepsDone > 0 || run.status === 'in_progress') return 'in_progress';
  return 'logged';   // run is recorded but no transfers captured yet
}

/* ----- Federal deposit schedule ----- */
/**
 * Returns 'monthly' or 'semi_weekly' based on lookback period.
 * For owner-only S-corps with reasonable salaries, this is essentially
 * always monthly (lookback period total taxes ≤ $50,000).
 *
 * Monthly schedule: federal deposit due by 15th of following month.
 * (e.g., January payroll → February 15 deposit)
 */
function federalDepositDueDate(payrollMonth, year) {
  // Monthly schedule: 15th of next month, accounting for year roll
  const nextMonth = payrollMonth + 1;
  if (nextMonth > 12) return `${parseInt(year, 10) + 1}-01-15`;
  return `${year}-${String(nextMonth).padStart(2, '0')}-15`;
}

/* ----- 941 quarterly schedule ----- */
function form941DueDates(year) {
  return [
    { q: 1, label: 'Q1 941', period: 'Jan–Mar', dueDate: `${year}-04-30` },
    { q: 2, label: 'Q2 941', period: 'Apr–Jun', dueDate: `${year}-07-31` },
    { q: 3, label: 'Q3 941', period: 'Jul–Sep', dueDate: `${year}-10-31` },
    { q: 4, label: 'Q4 941', period: 'Oct–Dec', dueDate: `${parseInt(year, 10) + 1}-01-31` },
  ];
}

/* ----- DE 9 / DE 9C quarterly schedule (California) ----- */
function de9DueDates(year) {
  return [
    { q: 1, label: 'Q1 DE 9/9C', period: 'Jan–Mar', dueDate: `${year}-04-30` },
    { q: 2, label: 'Q2 DE 9/9C', period: 'Apr–Jun', dueDate: `${year}-07-31` },
    { q: 3, label: 'Q3 DE 9/9C', period: 'Jul–Sep', dueDate: `${year}-10-31` },
    { q: 4, label: 'Q4 DE 9/9C', period: 'Oct–Dec', dueDate: `${parseInt(year, 10) + 1}-01-31` },
  ];
}

/** Aggregate logged payroll runs into 941 form data. */
function form941Data(year, quarter) {
  const monthsInQ = { 1:[1,2,3], 2:[4,5,6], 3:[7,8,9], 4:[10,11,12] }[quarter];
  const runs = getPayrollRuns().filter(r => {
    const [y, m] = (r.payDate || '').split('-').map(Number);
    return String(y) === String(year) && monthsInQ.includes(m);
  });
  return runs.reduce((acc, r) => ({
    wages: acc.wages + (r.gross || 0),
    fedIncomeTax: acc.fedIncomeTax + (r.fedIncomeTax || 0),
    ssWages: acc.ssWages + (r.ssWages || 0),
    medicareWages: acc.medicareWages + (r.medicareWages || 0),
    ssTax: acc.ssTax + (r.ssTotal || 0),
    medicareTax: acc.medicareTax + (r.medicareTotal || 0),
    addlMedicare: acc.addlMedicare + (r.addlMedicare || 0),
    fedDeposits: acc.fedDeposits + (r.fedDeposit || 0),
    runs: acc.runs + 1,
  }), {wages:0,fedIncomeTax:0,ssWages:0,medicareWages:0,ssTax:0,medicareTax:0,addlMedicare:0,fedDeposits:0,runs:0});
}

/** Aggregate logged payroll runs into DE 9 (California) form data. */
function de9Data(year, quarter) {
  const monthsInQ = { 1:[1,2,3], 2:[4,5,6], 3:[7,8,9], 4:[10,11,12] }[quarter];
  const runs = getPayrollRuns().filter(r => {
    const [y, m] = (r.payDate || '').split('-').map(Number);
    return String(y) === String(year) && monthsInQ.includes(m);
  });
  return runs.reduce((acc, r) => ({
    wages: acc.wages + (r.gross || 0),
    caPIT: acc.caPIT + (r.caPIT || 0),
    caSDI: acc.caSDI + (r.caSDI || 0),
    caSUI: acc.caSUI + (r.caSUI || 0),
    caETT: acc.caETT + (r.caETT || 0),
    caDeposits: acc.caDeposits + (r.caDeposit || 0),
    runs: acc.runs + 1,
  }), {wages:0,caPIT:0,caSDI:0,caSUI:0,caETT:0,caDeposits:0,runs:0});
}

/* =========================================================================
   OPERATING CALENDAR + LIABILITY LEDGER

   The single source of truth for "what needs to happen and when."
   Generates obligations from logged payroll runs + the payroll start
   config, joins against completion records, and computes state.

   Obligation types:
     - 'run'            : run payroll for a month
     - 'fed_deposit'    : EFTPS deposit for a month's payroll
     - 'ca_deposit'     : EDD deposit for a month's payroll
     - 'fed_quarterly'  : file Form 941 for a quarter
     - 'ca_quarterly'   : file DE 9 / DE 9C for a quarter
     - 'futa_annual'    : file Form 940 (FUTA)
     - 'w2_annual'      : file W-2 + W-3 with SSA

   States:
     - 'scheduled'  : future, no action needed
     - 'due'        : within 7 days
     - 'overdue'    : past due date, not yet complete
     - 'in_progress': workflow started, partial confirmations
     - 'complete'   : locked, full artifacts captured
     - 'na'         : not applicable (before payroll start, etc.)
   ========================================================================= */

/* ----- Completion record store. Each obligation that gets completed
   gets a record here keyed by obligation.id ----- */
function getCompletions() {
  return Store.get('bxp.payroll_completions', {});
}
function saveCompletions(c) {
  Store.set('bxp.payroll_completions', c);
}
function markComplete(obligationId, data) {
  const c = getCompletions();
  c[obligationId] = {
    ...data,
    completed_at: new Date().toISOString(),
  };
  saveCompletions(c);
}
function unmarkComplete(obligationId) {
  const c = getCompletions();
  delete c[obligationId];
  saveCompletions(c);
}
function getCompletion(obligationId) {
  return getCompletions()[obligationId] || null;
}

/* ----- Per-step deposit tracking. A 'run' obligation has up to 3
   sub-actions (net transfer, fed deposit confirm, ca deposit confirm).
   For simpler obligation types these aren't used. ----- */
function getRunSteps() {
  return Store.get('bxp.payroll_run_steps', {});
}
function saveRunSteps(s) {
  Store.set('bxp.payroll_run_steps', s);
}

const MONTH_LABELS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function obligationStatus(obligation, today) {
  if (obligation.notApplicable) return 'na';
  const completion = getCompletion(obligation.id);
  if (completion && completion.complete) return 'complete';
  const dueDate = obligation.dueDate;
  if (!dueDate) return 'scheduled';
  const daysOut = Math.ceil((new Date(dueDate) - new Date(today)) / 86400000);
  if (daysOut < 0) return 'overdue';
  if (daysOut <= 7) return 'due';
  return 'scheduled';
}

/**
 * Build the complete list of obligations for a year, in chronological order.
 * Each obligation is { id, type, period, label, dueDate, ...metadata }.
 *
 * The id schema is stable: e.g. "run:2026-04" identifies the April 2026 run,
 * "fed_deposit:2026-04" the federal deposit from April's run, etc. This
 * lets completion records survive code changes.
 */
function buildOperatingCalendar({ year, startMonth, payrollRuns, annualSalary, w4, de4, caSuiRate }) {
  const obligations = [];
  const yr = parseInt(year, 10);

  // Index payroll runs by month for quick lookup
  const runsByMonth = {};
  payrollRuns.forEach(r => {
    const m = parseInt((r.payDate || '').slice(5, 7), 10);
    if (m && (r.payDate || '').slice(0, 4) === String(yr)) runsByMonth[m] = r;
  });

  // --- Monthly obligations (run + fed deposit + ca deposit) ---
  for (let m = 1; m <= 12; m++) {
    const monthStr = `${yr}-${String(m).padStart(2, '0')}`;
    const beforeStart = m < startMonth;

    // The "run" obligation. Due date = last day of the month.
    const runDueDate = new Date(yr, m, 0).toISOString().slice(0, 10);
    const runId = `run:${monthStr}`;
    const loggedRun = runsByMonth[m];
    const runStatus = loggedRun ? payrollRunStatus(loggedRun) : 'not_started';

    // Only surface the "Run payroll" obligation when the run hasn't started yet.
    // Once started, the three sub-obligations (net transfer + 2 deposits) take over
    // — clicking any of them resumes the wizard.
    if (!loggedRun) {
      obligations.push({
        id: runId,
        type: 'run',
        period: monthStr,
        month: m,
        label: `Run ${MONTH_LABELS[m-1]} payroll`,
        dueDate: runDueDate,
        notApplicable: beforeStart,
        autoComplete: false,
        runStatus: 'not_started',
        sourceRun: null,
      });
    } else if (runStatus === 'complete') {
      // Run obligation shows as complete in the Completed bucket
      obligations.push({
        id: runId,
        type: 'run',
        period: monthStr,
        month: m,
        label: `Run ${MONTH_LABELS[m-1]} payroll`,
        dueDate: runDueDate,
        notApplicable: false,
        autoComplete: true,
        runStatus: 'complete',
        sourceRun: loggedRun,
      });
    }

    // The three transfer sub-obligations. Only exist if there's a logged run
    // AND it's not yet complete (when complete, they're all in the completed bucket).
    if (loggedRun) {
      const fedDueDate = federalDepositDueDate(m, yr);
      const payDate = loggedRun.payDate || runDueDate;
      // Net transfer due on the pay date itself
      obligations.push({
        id: `net_transfer:${monthStr}`,
        type: 'net_transfer',
        period: monthStr,
        month: m,
        label: `Net pay transfer · ${MONTH_LABELS[m-1]}`,
        dueDate: payDate,
        amount: loggedRun.netPay || 0,
        sourceRun: loggedRun,
      });
      obligations.push({
        id: `fed_deposit:${monthStr}`,
        type: 'fed_deposit',
        period: monthStr,
        month: m,
        label: `Federal payroll deposit · ${MONTH_LABELS[m-1]}`,
        dueDate: fedDueDate,
        amount: loggedRun.fedDeposit || 0,
        sourceRun: loggedRun,
      });
      obligations.push({
        id: `ca_deposit:${monthStr}`,
        type: 'ca_deposit',
        period: monthStr,
        month: m,
        label: `California payroll deposit · ${MONTH_LABELS[m-1]}`,
        dueDate: fedDueDate,  // Monthly CA depositors follow same 15th-of-next rule
        amount: loggedRun.caDeposit || 0,
        sourceRun: loggedRun,
      });
    }
  }

  // --- Quarterly filings ---
  form941DueDates(yr).forEach(d => {
    obligations.push({
      id: `fed_quarterly:${yr}-Q${d.q}`,
      type: 'fed_quarterly',
      period: `${yr}-Q${d.q}`,
      quarter: d.q,
      label: `File Form 941 — Q${d.q} ${yr}`,
      sub: `Federal quarterly return · ${d.period}`,
      dueDate: d.dueDate,
    });
  });

  de9DueDates(yr).forEach(d => {
    obligations.push({
      id: `ca_quarterly:${yr}-Q${d.q}`,
      type: 'ca_quarterly',
      period: `${yr}-Q${d.q}`,
      quarter: d.q,
      label: `File DE 9 + DE 9C — Q${d.q} ${yr}`,
      sub: `California quarterly return · ${d.period}`,
      dueDate: d.dueDate,
    });
  });

  // --- Annual filings (due Jan 31 of NEXT year) ---
  const nextYear = yr + 1;
  obligations.push({
    id: `futa_annual:${yr}`,
    type: 'futa_annual',
    period: `${yr}`,
    label: `File Form 940 (FUTA) — ${yr}`,
    sub: 'Federal annual unemployment tax return',
    dueDate: `${nextYear}-01-31`,
  });
  obligations.push({
    id: `w2_annual:${yr}`,
    type: 'w2_annual',
    period: `${yr}`,
    label: `File W-2 + W-3 with SSA — ${yr}`,
    sub: 'Annual wage and tax statement',
    dueDate: `${nextYear}-01-31`,
  });

  // Sort by due date
  obligations.sort((a, b) => (a.dueDate || '').localeCompare(b.dueDate || ''));
  return obligations;
}

/**
 * Compute status for every obligation against today's date and existing
 * completion records. Returns the same obligations array with .status added.
 */
function annotateCalendarStatus(obligations, today) {
  return obligations.map(o => {
    let status = obligationStatus(o, today);
    // For 'run' obligations, completion is implicit when payroll run is logged
    if (o.type === 'run' && o.autoComplete) status = 'complete';
    return { ...o, status };
  });
}

/** Bucket obligations into time windows for the calendar UI. */
function bucketCalendar(annotatedObligations, today) {
  const buckets = {
    overdue: [],
    today: [],
    next14: [],
    thisQuarter: [],
    later: [],
    complete: [],
  };
  const todayDate = new Date(today);
  const in14 = new Date(todayDate); in14.setDate(in14.getDate() + 14);
  const quarterEnd = new Date(todayDate.getFullYear(), Math.floor(todayDate.getMonth() / 3) * 3 + 3, 0);

  for (const o of annotatedObligations) {
    if (o.status === 'na') continue;
    if (o.status === 'complete') { buckets.complete.push(o); continue; }
    if (!o.dueDate) { buckets.later.push(o); continue; }
    const due = new Date(o.dueDate);
    if (due < todayDate) { buckets.overdue.push(o); continue; }
    if (due.toISOString().slice(0,10) === today) { buckets.today.push(o); continue; }
    if (due <= in14) { buckets.next14.push(o); continue; }
    if (due <= quarterEnd) { buckets.thisQuarter.push(o); continue; }
    buckets.later.push(o);
  }
  return buckets;
}

/** Outstanding liability summary — total dollars owed but unpaid. */
function calcOutstandingLiability(annotatedObligations) {
  let total = 0, fed = 0, ca = 0;
  for (const o of annotatedObligations) {
    if (o.status === 'complete' || o.status === 'na') continue;
    if (o.type === 'fed_deposit') { total += o.amount; fed += o.amount; }
    if (o.type === 'ca_deposit')  { total += o.amount; ca += o.amount; }
  }
  return { total, fed, ca };
}

/* ----- Friendly date formatting ----- */
function formatDueDateLong(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function daysUntil(iso, today) {
  if (!iso) return null;
  return Math.ceil((new Date(iso) - new Date(today)) / 86400000);
}

function relativeDueDate(iso, today) {
  const days = daysUntil(iso, today);
  if (days === null) return '';
  if (days === 0) return 'today';
  if (days === 1) return 'tomorrow';
  if (days === -1) return 'yesterday';
  if (days < 0) return `${Math.abs(days)} days ago`;
  if (days <= 14) return `in ${days} days`;
  return formatDueDateLong(iso);
}

function renderPayroll(root) {

  if (annualSalary <= 0) {
    root.innerHTML = `

      })}

        <p>Open <a href="#" onclick="navigate('comp');return false;">Owner Comp</a> to pick a defensible W-2 salary, then come back here to run monthly payroll.</p>
      </div>`;
    return;
  }

  const w4 = {
    filingStatus: s.payroll_w4_filing_status || 'mfj',
    multipleJobs: !!s.payroll_w4_multiple_jobs,
    dependents: Number(s.payroll_w4_dependents) || 0,
    otherIncome: Number(s.payroll_w4_other_income) || 0,
    deductions: Number(s.payroll_w4_deductions) || 0,
    extraWithhold: Number(s.payroll_w4_extra_withhold) || 0,
  };
  const de4 = {
    filingStatus: s.payroll_de4_filing_status || 'mfj',
    allowances: Number(s.payroll_de4_allowances) || 0,
    extraWithhold: Number(s.payroll_de4_extra_withhold) || 0,
  };
  const caSuiRate = Number(s.payroll_ca_sui_rate) || 0.034;

  // Run all 12 hypothetical periods
  const fullYear = runFullYearPayroll({ annualSalary, w4, de4, caSuiRate });

  // Logged runs
  const logged = getPayrollRuns().filter(r => (r.payDate || '').slice(0,4) === year);
  const loggedByMonth = {};
  logged.forEach(r => {
    const m = parseInt((r.payDate || '').slice(5,7), 10);
    if (m) loggedByMonth[m] = r;
  });

  // Find next unrun period
  const monthLabels = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const currentMonth = today.getMonth() + 1;
  // Payroll start month — months before this are not "overdue", they just don't apply.
  // Default to Jan if year matches start year, else 1.
  const startMonth = String(s.payroll_start_year) === year ? (Number(s.payroll_start_month) || 1) : 1;

  // The next "due" month is the earliest unrun month that's >= start month and <= current
  let nextRunMonth = null;
  for (let m = startMonth; m <= 12; m++) {
    if (!loggedByMonth[m] && m <= currentMonth) {
      nextRunMonth = m;
      break;
    }
  }

  // Allow user to manually preview any month via the selected-month state
  const userSelectedMonth = state._payrollSelectedMonth || null;
  const previewMonth = userSelectedMonth || nextRunMonth || Math.max(startMonth, currentMonth);
  const previewStub = fullYear.stubs[previewMonth - 1];

  // YTD actual (from logged runs)
  const ytdActual = logged.reduce((acc, r) => ({
    gross: acc.gross + (r.gross || 0),
    fedDeposit: acc.fedDeposit + (r.fedDeposit || 0),
    caDeposit: acc.caDeposit + (r.caDeposit || 0),
    netPay: acc.netPay + (r.netPay || 0),
  }), { gross: 0, fedDeposit: 0, caDeposit: 0, netPay: 0 });

  // Next federal & state deposit due dates (based on most-recent logged month)
  const lastLoggedMonth = Math.max(0, ...Object.keys(loggedByMonth).map(Number));
  const nextFedDepositDue = lastLoggedMonth ? federalDepositDueDate(lastLoggedMonth, year) : null;
  const nextFedDepositPending = lastLoggedMonth
    ? !logged.find(r => parseInt((r.payDate || '').slice(5,7), 10) === lastLoggedMonth)?.fedDepositPaid
    : false;

  // ===== OPERATING CALENDAR =====
  const calendarObligations = buildOperatingCalendar({
    year, startMonth, payrollRuns: logged, annualSalary, w4, de4, caSuiRate,
  });
  const annotated = annotateCalendarStatus(calendarObligations, todayIso);
  const buckets = bucketCalendar(annotated, todayIso);

  // Icon for each obligation type

    if (type === 'fed_quarterly' || type === 'ca_quarterly') return '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 2h6l2 2v8H3z"/><path d="M9 2v2h2M5 7h4M5 9h3"/></svg>';

      ${buckets.later.length > 0 ? `
        <div class="calendar-bucket" id="laterBucket" style="display:none">
          <div class="calendar-bucket-label">LATER THIS YEAR</div>
          ${buckets.later.map(renderObligationCard).join('')}
        </div>
        <button class="btn btn-sm btn-ghost mt-12" id="showLaterBtn" style="font-size:11.5px">▾ Show ${buckets.later.length} later this year</button>` : ''}

        <div class="calendar-bucket" id="completeBucket" style="display:none">
          <div class="calendar-bucket-label" style="color:var(--accent-2)">COMPLETED</div>
          ${buckets.complete.map(renderCompleteRow).join('')}
        </div>
        <button class="btn btn-sm btn-ghost mt-12" id="showCompleteBtn" style="font-size:11.5px">▾ Show ${buckets.complete.length} completed</button>` : ''}

      ${buckets.overdue.length === 0 && buckets.today.length === 0 && buckets.next14.length === 0 && buckets.thisQuarter.length === 0 ? `
        <div class="empty" style="padding:24px;text-align:left">
          <div style="font-family:var(--sans);font-weight:700;font-size:16px;color:var(--accent-2)">All caught up.</div>
          <p class="muted tiny mt-4">No payroll obligations are due in the next 90 days. Plan your next pay date when you're ready.</p>
        </div>` : ''}
    </div>
  `;

  root.innerHTML = `
    ${renderBrandBand({
      eyebrow: 'Payroll',
      title: 'Owner-only S-corp payroll',
      sub: `Monthly · ${year} · annual salary ${fmt.money(annualSalary, {absolute:true})}${startMonth > 1 ? ` · started ${monthLabels[startMonth-1]}` : ''}`,
      actions: nextRunMonth
        ? `<button class="btn btn-sm btn-primary" id="runPayrollBtn">Run ${monthLabels[nextRunMonth-1]} payroll →</button>`

    ${calendarHTML}

    <!-- ============ WITHHOLDING SETUP ============ -->
    <div class="card mb-24">
      <div class="row" style="justify-content:space-between;align-items:center;cursor:pointer" onclick="document.getElementById('withholdingForm').style.display = document.getElementById('withholdingForm').style.display === 'none' ? 'block' : 'none'">
        <div>
          <div class="section-title" style="margin-bottom:0">Withholding setup · W-4 and DE-4</div>
          <div class="muted tiny mt-4">Configure once. These drive every paycheck's federal and California income tax withholding.</div>
        </div>
        <span class="muted tiny">▼ click to expand</span>
      </div>
      <div id="withholdingForm" style="display:none;margin-top:18px;padding-top:18px;border-top:1px solid var(--border)">
        <div class="grid-2" style="gap:32px">
          <div>
            <h4 style="font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink);margin:0 0 12px">Federal W-4</h4>
            <div class="field">
              <label>Filing status (W-4 step 1c)</label>
              <select id="payroll_w4_filing_status">
                <option value="mfj" ${w4.filingStatus==='mfj'?'selected':''}>Married filing jointly / qualifying surviving spouse</option>
                <option value="single" ${w4.filingStatus==='single'?'selected':''}>Single or married filing separately</option>
                <option value="hoh" ${w4.filingStatus==='hoh'?'selected':''}>Head of household</option>
              </select>
            </div>
            <div class="field">
              <label class="row" style="cursor:pointer">
                <input type="checkbox" id="payroll_w4_multiple_jobs" ${w4.multipleJobs?'checked':''}/>
                <span>Step 2 box checked (multiple jobs / spouse works)</span>
              </label>
              <div class="field-hint">Check if you or spouse have other employment income — drives higher withholding.</div>
            </div>
            <div class="field">
              <label>Step 3 — dependents credit (annual $)</label>
              <input type="number" id="payroll_w4_dependents" step="500" value="${w4.dependents}"/>
              <div class="field-hint">$2,000 per child under 17 + $500 per other dependent. Enter the total.</div>
            </div>
            <div class="field">
              <label>Step 4(b) — annual deductions over standard</label>
              <input type="number" id="payroll_w4_deductions" step="500" value="${w4.deductions}"/>
              <div class="field-hint">If you itemize and deductions exceed standard ($30K MFJ in 2025), enter excess.</div>
            </div>
            <div class="field">
              <label>Step 4(c) — extra withholding per pay period</label>
              <input type="number" id="payroll_w4_extra_withhold" step="50" value="${w4.extraWithhold}"/>
              <div class="field-hint">Additional federal withheld each paycheck above the calculated amount.</div>
            </div>
          </div>
          <div>
            <h4 style="font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink);margin:0 0 12px">California DE-4</h4>
            <div class="field">
              <label>CA filing status</label>
              <select id="payroll_de4_filing_status">
                <option value="mfj" ${de4.filingStatus==='mfj'?'selected':''}>Married filing jointly</option>
                <option value="single" ${de4.filingStatus==='single'?'selected':''}>Single / married filing separately</option>
                <option value="hoh" ${de4.filingStatus==='hoh'?'selected':''}>Head of household</option>
              </select>
            </div>
            <div class="field">
              <label>Personal allowances</label>
              <input type="number" id="payroll_de4_allowances" step="1" value="${de4.allowances}"/>
              <div class="field-hint">Each allowance reduces annual CA tax by ~$154. Most owners use 0–2.</div>
            </div>
            <div class="field">
              <label>Additional CA withholding per pay period</label>
              <input type="number" id="payroll_de4_extra_withhold" step="50" value="${de4.extraWithhold}"/>
            </div>
            <div class="field">
              <label>Your CA SUI rate (from EDD notice)</label>
              <input type="number" id="payroll_ca_sui_rate" step="0.001" min="0" max="0.10" value="${caSuiRate}"/>
              <div class="field-hint">Default 3.4% (new employer). Your actual rate comes on your annual EDD UI Tax Rate Notice (form DE 2088). Update this when you receive a revised rate.</div>
            </div>
            <div class="field">
              <label>Payroll started on</label>
              <div class="row" style="gap:8px">
                <select id="payroll_start_month" style="flex:2">
                  ${monthLabels.map((label, i) => `<option value="${i+1}" ${(i+1) === Number(s.payroll_start_month)?'selected':''}>${label}</option>`).join('')}
                </select>
                <input type="number" id="payroll_start_year" step="1" min="2020" max="2099" value="${s.payroll_start_year || year}" style="flex:1"/>
              </div>
              <div class="field-hint">Months before this won't show as overdue. Set to the actual first month you ran payroll for this entity.</div>
            </div>
            <div class="cert-block" style="margin-top:14px;font-size:11px;padding:12px 16px">
              <strong>Tip:</strong> For S-corp owner-only payroll, simplest approach: filing status MFJ, multiple-jobs box unchecked, dependents and deductions as your actual situation, no extra withholding. Mirror the same on DE-4. Quarterly true-up via 1040-ES if needed.
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ DISCLAIMER ============ -->
    <div class="cert-block">
      <h4>What this tool does and doesn't do</h4>
      <p><strong>Calculates:</strong> Per-paycheck federal income tax withholding (Pub 15-T 2025), FICA both halves, additional Medicare, California PIT (DE 44 2025), CA SDI, and employer-side FUTA / SUI / ETT. YTD totals roll forward correctly for SS wage cap and additional Medicare thresholds.</p>
      <p style="margin-top:10px"><strong>Does not file forms.</strong> Form 941 (federal quarterly), DE 9 / DE 9C (California quarterly), W-2 / W-3 (annual), and DE 88 (CA payroll tax deposit) all need to be filed by you through EFTPS, IRS, and EDD e-Services. The tool produces every number you need to type into those portals.</p>
      <p style="margin-top:10px"><strong>Doesn't handle:</strong> Mid-year salary changes, bonus runs, fringe benefits, S-corp health insurance add-back to W-2 box 1 (which is required if your S-corp pays your health insurance — see your CPA), or workers' comp. California requires WC for S-corp owners unless formally exempted via DWC Form 2570.</p>
      <p style="margin-top:10px"><strong>Replaces ~80% of Gusto's per-paycheck arithmetic for one specific use case.</strong> You give up direct deposit, automated filing, and human support. You save ~$50/month and learn how your own payroll works.</p>
    </div>
  `;

  // -------- WIRE UP --------

  // Withholding form
  const wireField = (id, parser) => {
    const el = document.getElementById(id);
    if (el) el.onchange = (e) => {
      const val = parser ? parser(e.target) : e.target.value;
      state.settings[id] = val;
      saveSettings();
      render();
    };
  };
  wireField('payroll_w4_filing_status');
  wireField('payroll_w4_multiple_jobs', el => el.checked);
  wireField('payroll_w4_dependents', el => parseFloat(el.value) || 0);
  wireField('payroll_w4_deductions', el => parseFloat(el.value) || 0);
  wireField('payroll_w4_extra_withhold', el => parseFloat(el.value) || 0);
  wireField('payroll_de4_filing_status');
  wireField('payroll_de4_allowances', el => parseFloat(el.value) || 0);
  wireField('payroll_de4_extra_withhold', el => parseFloat(el.value) || 0);
  wireField('payroll_ca_sui_rate', el => parseFloat(el.value) || 0.034);
  wireField('payroll_start_month', el => parseInt(el.value, 10) || 1);
  wireField('payroll_start_year', el => parseInt(el.value, 10) || new Date().getFullYear());

  // Month selector — picks which paystub to preview
  const monthSelect = document.getElementById('payrollMonthSelect');
  if (monthSelect) {
    monthSelect.onchange = (e) => {
      state._payrollSelectedMonth = parseInt(e.target.value, 10);
      render();
    };
  }

  // ===== OPERATING CALENDAR HANDLERS =====
  // CTA buttons on every obligation row — dispatch by type
  document.querySelectorAll('.oblig-cta[data-oblig-id]').forEach(btn => {
    btn.onclick = (e) => {
      const id = e.currentTarget.dataset.obligId;
      const o = annotated.find(x => x.id === id);
      if (!o) return;
      if (o.type === 'run') {
        openPayrollDialog(o.month, fullYear.stubs[o.month - 1], year);
      } else if (o.type === 'net_transfer' || o.type === 'fed_deposit' || o.type === 'ca_deposit') {
        // If there's a source run, route through the wizard so the user sees
        // the full 3-step context. The wizard auto-opens to step 2.
        if (o.sourceRun) {
          openPayrollDialog(o.month, fullYear.stubs[o.month - 1], year);
        } else if (o.type === 'fed_deposit' || o.type === 'ca_deposit') {
          openDepositDialog(o);
        }
      } else if (o.type === 'fed_quarterly' || o.type === 'ca_quarterly') {
        openFilingDialog(o);
      } else if (o.type === 'futa_annual' || o.type === 'w2_annual') {
        openAnnualFilingDialog(o);
      }
    };
  });

  // "Show later" / "Show completed" toggles
  const showLaterBtn = document.getElementById('showLaterBtn');
  if (showLaterBtn) {
    showLaterBtn.onclick = () => {
      const bucket = document.getElementById('laterBucket');
      const hidden = bucket.style.display === 'none';
      bucket.style.display = hidden ? 'block' : 'none';
      showLaterBtn.textContent = hidden
        ? `▴ Hide ${buckets.later.length} later this year`
        : `▾ Show ${buckets.later.length} later this year`;
    };
  }
  const showCompleteBtn = document.getElementById('showCompleteBtn');
  if (showCompleteBtn) {
    showCompleteBtn.onclick = () => {
      const bucket = document.getElementById('completeBucket');
      const hidden = bucket.style.display === 'none';
      bucket.style.display = hidden ? 'block' : 'none';
      showCompleteBtn.textContent = hidden
        ? `▴ Hide ${buckets.complete.length} completed`
        : `▾ Show ${buckets.complete.length} completed`;
    };
  }

  // Brand-band "Run [Month] payroll" button
  if (nextRunMonth) {
    document.getElementById('runPayrollBtn').onclick = () => {
      openPayrollDialog(nextRunMonth, fullYear.stubs[nextRunMonth - 1], year);
    };
  }
}

/**
 * Modal: confirm and log a payroll run for a specific month.
 */
/* =========================================================================
   PAYROLL RUN WIZARD — 3 steps
     1. Confirm (set pay date, lock in the run)
     2. Execute three transfers (net, EFTPS, EDD)
     3. Summary & complete

   Wizard state is held in module-local variables; user can close and reopen
   without losing progress. The run record is created at step 1; sub-step
   completions accumulate in bxp.payroll_completions.
   ========================================================================= */

const PayrollWizard = {
  month: null,
  year: null,
  stub: null,
  run: null,       // The payroll run record (created in step 1)
  step: 1,         // 1, 2, or 3

  open(month, stub, year, opts = {}) {
    this.month = month;
    this.year = parseInt(year, 10);
    this.stub = stub;
    this.run = findPayrollRun({ month, year: this.year });
    // If the run exists and has all transfers complete, jump to summary
    if (this.run && payrollRunStatus(this.run) === 'complete') {
      this.step = 3;
    } else if (this.run) {
      this.step = 2;
    } else {
      this.step = opts.startAtConfirm === false ? 2 : 1;
    }
    this.render();
  },

  monthStr() {
    return `${this.year}-${String(this.month).padStart(2, '0')}`;
  },

  render() {
    if (this.step === 1) this.renderStep1Confirm();
    else if (this.step === 2) this.renderStep2Execute();
    else this.renderStep3Summary();
  },

  stepIndicator() {
    const dot = (n, label) => {
      const active = n === this.step;
      const done = n < this.step;
      const bg = done ? 'var(--accent-2)' : active ? 'var(--navy)' : 'var(--border-2)';
      const fg = (done || active) ? '#fff' : 'var(--ink-3)';
      return `
        <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0">
          <div style="flex-shrink:0;width:24px;height:24px;border-radius:50%;background:${bg};color:${fg};display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:11px;font-weight:700">${done ? '✓' : n}</div>
          <div style="font-family:var(--sans);font-size:11.5px;font-weight:600;color:${active ? 'var(--ink)' : 'var(--ink-3)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${label}</div>
        </div>`;
    };
    return `
      <div style="display:flex;align-items:center;gap:6px;margin:0 0 18px;padding:12px 16px;background:var(--bg-alt);border-radius:6px">
        ${dot(1, 'Confirm')}
        <div style="flex-shrink:0;width:16px;height:1px;background:var(--border-2)"></div>
        ${dot(2, 'Execute transfers')}
        <div style="flex-shrink:0;width:16px;height:1px;background:var(--border-2)"></div>
        ${dot(3, 'Complete')}
      </div>`;
  },

  // ---------- STEP 1: Confirm ----------
  renderStep1Confirm() {
    const monthLabel = MONTH_LABELS[this.month - 1];
    let defaultPayDate = new Date(this.year, this.month, 0);
    while (defaultPayDate.getDay() === 0 || defaultPayDate.getDay() === 6) {
      defaultPayDate.setDate(defaultPayDate.getDate() - 1);
    }
    const defaultPayDateIso = defaultPayDate.toISOString().slice(0, 10);
    const s = this.stub;

    openModal(`
      <div class="modal-title">${monthLabel} ${this.year} payroll · confirm</div>
      ${this.stepIndicator()}
      <div class="muted tiny mb-16" style="line-height:1.55">
        Before you start the transfers, confirm the pay date and the calculated amounts. Once you advance to step 2, this run is locked in and three transfer obligations appear on your calendar.
      </div>

      <div class="field">
        <label>Pay date</label>
        <input type="date" id="prPayDate" value="${defaultPayDateIso}"/>
        <div class="field-hint">When the net pay actually hits your personal account. Defaults to the last weekday of ${monthLabel}.</div>
      </div>

      <div style="background:var(--bg-alt);padding:18px 22px;border-radius:6px;margin:18px 0">
        <div class="card-eyebrow mb-8">Calculated this run</div>
        <table style="width:100%;font-size:13.5px">
          <tbody>
            <tr><td style="padding:4px 0;color:var(--ink-2)">Gross pay</td><td class="num" style="font-family:var(--mono);text-align:right">${fmt.money(s.grossPerPeriod, {absolute:true})}</td></tr>
            <tr><td style="padding:4px 0;color:var(--ink-3)" class="tiny">Employee withholdings</td><td class="num" style="font-family:var(--mono);text-align:right;color:var(--ink-3)" class="tiny">(${fmt.money(s.employee.totalWithheld, {absolute:true})})</td></tr>
            <tr style="border-top:1px solid var(--border)"><td style="padding:8px 0"><strong style="color:var(--accent-2)">→ Net to your personal account</strong></td><td class="num" style="font-family:var(--mono);text-align:right;font-weight:600;color:var(--accent-2);font-size:15px">${fmt.money(s.netPay, {absolute:true})}</td></tr>
            <tr><td style="padding:6px 0"><strong style="color:var(--navy)">→ Federal deposit (EFTPS)</strong></td><td class="num" style="font-family:var(--mono);text-align:right;font-weight:700;color:var(--navy)">${fmt.money(s.deposits.federal, {absolute:true})}</td></tr>
            <tr><td style="padding:6px 0"><strong style="color:var(--navy)">→ California deposit (EDD)</strong></td><td class="num" style="font-family:var(--mono);text-align:right;font-weight:700;color:var(--navy)">${fmt.money(s.deposits.california, {absolute:true})}</td></tr>
          </tbody>
        </table>
      </div>

      <div class="field">
        <label>Note (optional)</label>
        <input type="text" id="prNote" placeholder="e.g., regular monthly run"/>
      </div>

      <div class="row mt-16" style="justify-content:flex-end;gap:8px">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="prStartBtn">Start transfers →</button>
      </div>
    `);

    document.getElementById('prStartBtn').onclick = () => {
      const payDate = document.getElementById('prPayDate').value;
      if (!payDate) { toast('Pick a pay date.'); return; }
      // Create the payroll run record. Mark in_progress.
      logPayrollRun({
        payDate,
        month: this.month,
        year: this.year,
        status: 'in_progress',
        gross: this.stub.grossPerPeriod,
        fedIncomeTax: this.stub.employee.fedIncomeTax,
        ssEmployee: this.stub.employee.ssEmployee,
        ssEmployer: this.stub.employer.ssEmployer,
        ssTotal: this.stub.employee.ssEmployee + this.stub.employer.ssEmployer,
        ssWages: Math.min(this.stub.grossPerPeriod, FICA_2025.ss_wage_base - this.stub.ytdGrossBefore),
        medicareEmployee: this.stub.employee.medicareEmployee,
        medicareEmployer: this.stub.employer.medicareEmployer,
        medicareTotal: this.stub.employee.medicareEmployee + this.stub.employer.medicareEmployer,
        medicareWages: this.stub.grossPerPeriod,
        addlMedicare: this.stub.employee.addlMedicare,
        caPIT: this.stub.employee.caPIT,
        caSDI: this.stub.employee.caSDI,
        caSUI: this.stub.employer.caSUI,
        caETT: this.stub.employer.caETT,
        futa: this.stub.employer.futa,
        netPay: this.stub.netPay,
        fedDeposit: this.stub.deposits.federal,
        caDeposit: this.stub.deposits.california,
        note: document.getElementById('prNote').value,
      });
      this.run = findPayrollRun({ month: this.month, year: this.year });
      this.step = 2;
      this.render();
    };
  },

  // ---------- STEP 2: Execute three transfers ----------
  renderStep2Execute() {
    const monthLabel = MONTH_LABELS[this.month - 1];
    const monthStr = this.monthStr();
    const s = this.stub;

    // Get completion state for each of the three sub-steps
    const transfers = [
      {
        id: `net_transfer:${monthStr}`,
        type: 'net_transfer',
        title: 'Net pay → your personal account',
        amount: s.netPay,
        from: 'S-corp operating account',
        to: 'Your personal checking',
        portalName: 'your bank',
        portalUrl: '',
        instructions: 'Wire or ACH the net pay amount from your S-corp operating account to your personal checking. Record the reference number from your bank.',
        confLabel: 'Reference / transaction ID',
      },
      {
        id: `fed_deposit:${monthStr}`,
        type: 'fed_deposit',
        title: 'Federal payroll deposit',
        amount: s.deposits.federal,
        portalName: 'EFTPS',
        portalUrl: 'https://www.eftps.gov',
        instructions: `On EFTPS, choose Form 941 → payment period ${monthLabel} ${this.year}. Schedule the payment (settles within 1 business day). Capture the confirmation number.`,
        confLabel: 'EFTPS confirmation number',
      },
      {
        id: `ca_deposit:${monthStr}`,
        type: 'ca_deposit',
        title: 'California payroll deposit',
        amount: s.deposits.california,
        portalName: 'EDD e-Services',
        portalUrl: 'https://eddservices.edd.ca.gov',
        instructions: `On EDD e-Services, select Payroll Tax Deposit (DE 88) for period ${monthLabel} ${this.year}. Capture the confirmation number.`,
        confLabel: 'EDD confirmation number',
      },
    ];

    const completions = transfers.map(t => ({ ...t, completion: getCompletion(t.id) }));
    const doneCount = completions.filter(c => c.completion?.complete).length;

    const transferCard = (t) => {
      const completion = t.completion;
      const isDone = !!completion?.complete;
      return `
        <div style="border:1px solid ${isDone ? 'var(--accent-2)' : 'var(--border-2)'};border-radius:6px;padding:16px 18px;margin-bottom:12px;background:${isDone ? 'rgba(5,150,105,0.04)' : 'var(--card)'}">
          <div class="row" style="justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap">
            <div style="flex:1;min-width:240px">
              <div class="row" style="gap:8px;align-items:center">
                <div style="width:22px;height:22px;border-radius:50%;background:${isDone ? 'var(--accent-2)' : 'var(--bg-alt)'};color:${isDone ? '#fff' : 'var(--ink-3)'};display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:11px;font-weight:700">${isDone ? '✓' : ''}</div>
                <div style="font-family:var(--sans);font-size:14px;font-weight:700;color:var(--ink)">${t.title}</div>
              </div>
              <div style="font-family:var(--sans);font-size:24px;font-weight:600;color:var(--navy);letter-spacing:-0.01em;font-variant-numeric:tabular-nums;margin-top:8px">
                ${fmt.money(t.amount, {absolute:true})}
                <button class="btn btn-sm btn-ghost" data-copy-amount="${t.amount.toFixed(2)}" style="margin-left:8px;font-size:10.5px">Copy</button>
              </div>
              ${isDone ? `
                <div class="muted tiny mt-8">
                  Captured ${fmt.dateShort(completion.paid_date || completion.completed_at?.slice(0,10) || '')}
                  ${completion.confirmation ? ` · #${escapeHTML(completion.confirmation)}` : ''}
                </div>
              ` : `
                <div class="muted tiny mt-8" style="line-height:1.55">${escapeHTML(t.instructions)}</div>
                ${t.portalUrl ? `<a href="${t.portalUrl}" target="_blank" rel="noopener" class="muted tiny" style="color:var(--steel);font-weight:600;display:inline-block;margin-top:8px">→ Open ${t.portalName}</a>` : ''}
              `}
            </div>
            <div style="flex-shrink:0">
              ${isDone
                ? `<button class="btn btn-sm btn-ghost" data-edit-transfer="${t.id}">Edit</button>`
                : `<button class="btn btn-sm btn-primary" data-do-transfer="${t.id}">Record</button>`}
            </div>
          </div>
        </div>`;
    };

    openModal(`

/**
 * Modal: file a quarterly return (Form 941 or DE 9/DE 9C).
 * Shows the pre-populated numbers and captures filing confirmation.
 */
function openFilingDialog(obligation) {
  const isFed = obligation.type === 'fed_quarterly';
  const formName = isFed ? 'Form 941' : 'DE 9 + DE 9C';
  const portalName = isFed ? 'IRS / EFTPS' : 'EDD e-Services';
  const portalUrl = isFed ? 'https://www.irs.gov/forms-pubs/about-form-941' : 'https://eddservices.edd.ca.gov';
  const yr = parseInt(obligation.period.slice(0, 4), 10);
  const data = isFed ? form941Data(yr, obligation.quarter) : de9Data(yr, obligation.quarter);
  const today = new Date().toISOString().slice(0, 10);
  const existing = getCompletion(obligation.id) || {};

  // Verify the deposits the user has logged against what 941 expects
  const expectedDeposits = data.fedDeposits || data.caDeposits || 0;
  const monthsInQ = { 1:[1,2,3], 2:[4,5,6], 3:[7,8,9], 4:[10,11,12] }[obligation.quarter];
  const yearStr = String(yr);
  const depositCompletions = monthsInQ.map(m => {
    const monthStr = `${yearStr}-${String(m).padStart(2, '0')}`;
    const depId = `${isFed ? 'fed_deposit' : 'ca_deposit'}:${monthStr}`;
    return { month: m, completion: getCompletion(depId), expected: monthStr };
  });
  const totalDeposited = depositCompletions.reduce((s, d) => s + (d.completion?.amount || 0), 0);
  const depositsCoverFiling = Math.abs(totalDeposited - expectedDeposits) < 1;
  const undepositedMonths = depositCompletions.filter(d => !d.completion?.complete);

  const lineItems = isFed ? `
    <tr><td class="muted tiny" style="padding:5px 0">Line 2 · Wages, tips, comp</td><td class="num" style="font-family:var(--mono);text-align:right">${fmt.money(data.wages || 0, {absolute:true})}</td></tr>
    <tr><td class="muted tiny" style="padding:5px 0">Line 3 · Federal income tax withheld</td><td class="num" style="font-family:var(--mono);text-align:right">${fmt.money(data.fedIncomeTax || 0, {absolute:true})}</td></tr>
    <tr><td class="muted tiny" style="padding:5px 0">Line 5a · SS wages × 12.4%</td><td class="num" style="font-family:var(--mono);text-align:right">${fmt.money((data.ssWages || 0) * 0.124, {absolute:true})}</td></tr>
    <tr><td class="muted tiny" style="padding:5px 0">Line 5c · Medicare wages × 2.9%</td><td class="num" style="font-family:var(--mono);text-align:right">${fmt.money((data.medicareWages || 0) * 0.029, {absolute:true})}</td></tr>
    ${(data.addlMedicare || 0) > 0 ? `<tr><td class="muted tiny" style="padding:5px 0">Line 5d · Additional Medicare</td><td class="num" style="font-family:var(--mono);text-align:right">${fmt.money(data.addlMedicare, {absolute:true})}</td></tr>` : ''}
    <tr style="border-top:1px solid var(--border)"><td style="padding:8px 0"><strong>Total tax (Line 6)</strong></td><td class="num" style="font-family:var(--mono);text-align:right;font-weight:700">${fmt.money((data.fedIncomeTax || 0) + (data.ssWages || 0) * 0.124 + (data.medicareWages || 0) * 0.029 + (data.addlMedicare || 0), {absolute:true})}</td></tr>
    <tr><td style="padding:5px 0">Total deposits made (Line 13)</td><td class="num" style="font-family:var(--mono);text-align:right">${fmt.money(data.fedDeposits || 0, {absolute:true})}</td></tr>
  ` : `
    <tr><td class="muted tiny" style="padding:5px 0">Total CA wages</td><td class="num" style="font-family:var(--mono);text-align:right">${fmt.money(data.wages || 0, {absolute:true})}</td></tr>
    <tr><td class="muted tiny" style="padding:5px 0">CA PIT withheld</td><td class="num" style="font-family:var(--mono);text-align:right">${fmt.money(data.caPIT || 0, {absolute:true})}</td></tr>
    <tr><td class="muted tiny" style="padding:5px 0">CA SDI</td><td class="num" style="font-family:var(--mono);text-align:right">${fmt.money(data.caSDI || 0, {absolute:true})}</td></tr>
    <tr><td class="muted tiny" style="padding:5px 0">CA SUI (employer)</td><td class="num" style="font-family:var(--mono);text-align:right">${fmt.money(data.caSUI || 0, {absolute:true})}</td></tr>
    <tr><td class="muted tiny" style="padding:5px 0">CA ETT (employer)</td><td class="num" style="font-family:var(--mono);text-align:right">${fmt.money(data.caETT || 0, {absolute:true})}</td></tr>
    <tr style="border-top:1px solid var(--border)"><td style="padding:8px 0"><strong>Total CA payroll tax</strong></td><td class="num" style="font-family:var(--mono);text-align:right;font-weight:700">${fmt.money(data.caDeposits || 0, {absolute:true})}</td></tr>
  `;

  openModal(`
    <div class="modal-title">File ${formName} · Q${obligation.quarter} ${yr}</div>
    <div class="muted tiny mt-8 mb-16">${data.runs} payroll run${data.runs===1?'':'s'} aggregated for this quarter. Use these numbers to file at ${portalName}.</div>

    ${undepositedMonths.length > 0 ? `
      <div class="mapping-warn mb-16" style="font-size:12px;line-height:1.5">
        <strong>⚠ ${undepositedMonths.length} deposit${undepositedMonths.length===1?'':'s'} not yet marked complete.</strong>
        Months ${undepositedMonths.map(d => MONTH_LABELS[d.month-1]).join(', ')} have logged payroll but unconfirmed deposits. File ${formName} only after all monthly deposits are made and reconciled.
      </div>` : ''}

    <div style="background:var(--bg-alt);padding:18px 22px;border-radius:6px;margin-bottom:18px">
      <div class="section-title" style="margin-bottom:10px">Pre-populated ${formName} values</div>
      <table style="width:100%;font-size:13px">
        <tbody>${lineItems}</tbody>
      </table>
    </div>

    <div class="cert-block" style="margin-top:0;font-size:12px;padding:14px 18px;line-height:1.6">
      <strong>How to file:</strong>
      <ol style="margin:8px 0 0 18px;padding:0">
        <li>Sign into <a href="${portalUrl}" target="_blank" rel="noopener" style="color:var(--steel);font-weight:600">${portalName}</a></li>
        <li>Open ${formName} for Q${obligation.quarter} ${yr}</li>
        <li>Transcribe the values above into the corresponding lines</li>
        <li>Review, submit, capture the filing confirmation</li>
        <li>Save the PDF acknowledgement to your records</li>
      </ol>
    </div>

    <div class="grid-2 mt-16" style="gap:14px">
      <div class="field">
        <label>Date filed</label>
        <input type="date" id="filDate" value="${existing.filed_date || today}"/>
      </div>
      <div class="field">
        <label>Filing confirmation <span style="color:var(--danger)">*</span></label>
        <input type="text" id="filConf" value="${escapeHTML(existing.confirmation || '')}" placeholder="From ${portalName}" autofocus/>
      </div>
    </div>
    <div class="field">
      <label>Note (optional)</label>
      <input type="text" id="filNote" value="${escapeHTML(existing.note || '')}" placeholder="e.g., PDF saved to /tax/2026/941-Q1.pdf"/>
    </div>

    <div class="row mt-16" style="justify-content:space-between;gap:8px">
      ${existing.complete ? `<button class="btn btn-ghost" id="filUnmarkBtn" style="color:var(--danger)">Unmark complete</button>` : '<span></span>'}
      <div class="row" style="gap:8px">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="filSaveBtn">${existing.complete ? 'Update' : 'Mark filed'}</button>
      </div>
    </div>
  `);

  document.getElementById('filSaveBtn').onclick = () => {
    const conf = document.getElementById('filConf').value.trim();
    if (!conf) { toast(`Enter the filing confirmation from ${portalName}.`); return; }
    markComplete(obligation.id, {
      complete: true,
      filed_date: document.getElementById('filDate').value,
      confirmation: conf,
      note: document.getElementById('filNote').value,
    });
    closeModal();
    toast(`${formName} filed for Q${obligation.quarter}.`);
    render();
  };

  if (existing.complete) {
    document.getElementById('filUnmarkBtn').onclick = () => {
      if (!confirm('Unmark this filing as complete?')) return;
      unmarkComplete(obligation.id);
      closeModal();
      render();
    };
  }
}

/** Annual filing (W-2 + W-3, or Form 940). Pre-populates from YTD totals. */
function openAnnualFilingDialog(obligation) {
  const isW2 = obligation.type === 'w2_annual';
  const formName = isW2 ? 'W-2 + W-3' : 'Form 940 (FUTA)';
  const portalName = isW2 ? 'SSA Business Services Online (BSO)' : 'IRS / EFTPS';
  const portalUrl = isW2 ? 'https://www.ssa.gov/bso/' : 'https://www.irs.gov/forms-pubs/about-form-940';
  const yr = parseInt(obligation.period, 10);
  const today = new Date().toISOString().slice(0, 10);
  const existing = getCompletion(obligation.id) || {};

  // Aggregate the full year of logged payroll
  const allRuns = getPayrollRuns().filter(r => (r.payDate || '').slice(0,4) === String(yr));
  const ytd = allRuns.reduce((acc, r) => ({
    gross: acc.gross + (r.gross || 0),

    <tr><td class="muted tiny" style="padding:5px 0">Box 5 · Medicare wages</td><td class="num" style="font-family:var(--mono);text-align:right">${fmt.money(ytd.medicareWages, {absolute:true})}</td></tr>
    <tr><td class="muted tiny" style="padding:5px 0">Box 6 · Medicare tax withheld</td><td class="num" style="font-family:var(--mono);text-align:right">${fmt.money(ytd.medicareEmployee + ytd.addlMedicare, {absolute:true})}</td></tr>
    <tr><td class="muted tiny" style="padding:5px 0">Box 16 · State wages (CA)</td><td class="num" style="font-family:var(--mono);text-align:right">${fmt.money(ytd.gross, {absolute:true})}</td></tr>
    <tr><td class="muted tiny" style="padding:5px 0">Box 17 · State income tax (CA PIT)</td><td class="num" style="font-family:var(--mono);text-align:right">${fmt.money(ytd.caPIT, {absolute:true})}</td></tr>
    <tr><td class="muted tiny" style="padding:5px 0">Box 19 · Local tax (CA SDI)</td><td class="num" style="font-family:var(--mono);text-align:right">${fmt.money(ytd.caSDI, {absolute:true})}</td></tr>
  ` : `
    <tr><td class="muted tiny" style="padding:5px 0">Line 3 · Total payments to employees</td><td class="num" style="font-family:var(--mono);text-align:right">${fmt.money(ytd.gross, {absolute:true})}</td></tr>
    <tr><td class="muted tiny" style="padding:5px 0">Line 5 · Total wages over $7,000</td><td class="num" style="font-family:var(--mono);text-align:right">${fmt.money(Math.max(0, ytd.gross - 7000), {absolute:true})}</td></tr>
    <tr><td class="muted tiny" style="padding:5px 0">Line 7 · Taxable FUTA wages</td><td class="num" style="font-family:var(--mono);text-align:right">${fmt.money(Math.min(7000, ytd.gross), {absolute:true})}</td></tr>
    <tr><td class="muted tiny" style="padding:5px 0">Line 8 · FUTA tax (0.6%)</td><td class="num" style="font-family:var(--mono);text-align:right">${fmt.money(Math.min(7000, ytd.gross) * 0.006, {absolute:true})}</td></tr>
    <tr style="border-top:1px solid var(--border)"><td style="padding:8px 0"><strong>Total FUTA tax</strong></td><td class="num" style="font-family:var(--mono);text-align:right;font-weight:700">${fmt.money(ytd.futa, {absolute:true})}</td></tr>
  `;

  openModal(`

    <div class="muted tiny mt-8 mb-16">${allRuns.length} payroll run${allRuns.length===1?'':'s'} aggregated for the full year. ${isW2 ? 'Both W-2 (to you) and W-3 transmittal (to SSA) get filed together via BSO.' : 'FUTA is the employer-only federal unemployment tax. Annual filing.'}</div>

    <div style="background:var(--bg-alt);padding:18px 22px;border-radius:6px;margin-bottom:18px">
