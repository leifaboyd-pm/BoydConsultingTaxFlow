    [980987,   104108.78, 0.1353],
    [9999999,  1404049.09, 0.1453],
  ],
};

/** California DE 44 standard deduction (annual) by filing status, 2025 */
const CA_STD_DEDUCTION_PAYROLL_2025 = {
  single: 5540, mfj: 11080, hoh: 11080, mfs: 5540,
};

/** California DE 44 personal allowance credit (annual) — applied at end */
const CA_PERSONAL_ALLOWANCE_CREDIT_2025 = 154.00; // Per allowance

/**
 * Federal income tax withholding for ONE pay period using Pub 15-T
 * Worksheet 1A (Annual Payroll Period — Standard).
 *
 * Following the IRS 4-step process:
 *   1. Compute annualized wages (gross × pay periods)
 *   2. Subtract step-4(b) deductions
 *   3. If multiple jobs box NOT checked, subtract $12,900 (MFJ) or $8,600 (other)
 *   4. Apply bracket table → annual tax
 *   5. Subtract step-3 dependent credit
 *   6. Divide by pay periods → per-period tax
 *   7. Add step-4(c) extra withholding
 */
function fedWithholdingPerPeriod({ grossPerPeriod, payPeriods, w4 }) {
  const annualWages = grossPerPeriod * payPeriods;
  // Step-4(b) deductions reduce annualized wages
  const adjusted1 = annualWages - (w4.deductions || 0);
  // If multiple-jobs box NOT checked, reduce by standard amount
  const standardReduction = w4.multipleJobs ? 0
    : (w4.filingStatus === 'mfj' ? 12900 : 8600);
  const adjusted2 = adjusted1 - standardReduction;

  // Apply brackets
  const brackets = FED_PUB15T_2025[w4.filingStatus] || FED_PUB15T_2025.mfj;
  let annualTax = 0;
  for (let i = brackets.length - 1; i >= 0; i--) {
    const [over, base, rate] = brackets[i];
    if (adjusted2 > over) {
      annualTax = base + (adjusted2 - over) * rate;
      break;
    }
  }
  annualTax = Math.max(0, annualTax);
  // Step-3 dependent credits reduce annual tax
  annualTax = Math.max(0, annualTax - (w4.dependents || 0));
  // Per-period
  const perPeriod = annualTax / payPeriods;
  // Add step-4(c) extra withholding
  return Math.max(0, perPeriod + (w4.extraWithhold || 0));
}

/**
 * California PIT withholding for ONE pay period using DE 44 Method B.
 * Steps:
 *   1. Annualized wages
 *   2. Subtract estimated deductions (1 allowance × $1,000 if not itemized)
 *      — for owner-only, default to standard deduction subtraction
 *   3. Subtract std deduction
 *   4. Apply DE 44 brackets → annual tax
 *   5. Subtract personal allowance credit
 *   6. Divide by pay periods
 *   7. Add additional withholding
 */
function caWithholdingPerPeriod({ grossPerPeriod, payPeriods, de4 }) {
  const annualWages = grossPerPeriod * payPeriods;
  const stdDed = CA_STD_DEDUCTION_PAYROLL_2025[de4.filingStatus] || CA_STD_DEDUCTION_PAYROLL_2025.mfj;
  const taxableAnnual = Math.max(0, annualWages - stdDed);

  const brackets = CA_DE44_2025[de4.filingStatus] || CA_DE44_2025.mfj;
  let annualTax = 0;
  for (let i = brackets.length - 1; i >= 0; i--) {
    const [over, base, rate] = brackets[i];
    if (taxableAnnual > over) {
      annualTax = base + (taxableAnnual - over) * rate;
      break;
    }
  }
  // Subtract allowance credits
  const allowanceCredit = (de4.allowances || 0) * CA_PERSONAL_ALLOWANCE_CREDIT_2025;
  annualTax = Math.max(0, annualTax - allowanceCredit);

  const perPeriod = annualTax / payPeriods;
  return Math.max(0, perPeriod + (de4.extraWithhold || 0));
}

/**
 * Generate a complete paystub for one pay period.
 * @param {object} input
 *   annualSalary, payPeriods, periodNumber (1-N for the year),
 *   ytdGrossBefore (gross paid in earlier periods this year, for SS cap & addl Medicare)
 *   w4 = { filingStatus, multipleJobs, dependents, otherIncome, deductions, extraWithhold }
 *   de4 = { filingStatus, allowances, extraWithhold }
 *   caSuiRate (employer's actual rate)
 */
function runPayroll(input) {
  const { annualSalary, payPeriods, periodNumber, ytdGrossBefore, w4, de4, caSuiRate } = input;
  const grossPerPeriod = annualSalary / payPeriods;
  const ytdGrossAfter = ytdGrossBefore + grossPerPeriod;

  // ---- FEDERAL INCOME TAX ----
  const fedIncomeTax = fedWithholdingPerPeriod({ grossPerPeriod, payPeriods, w4 });

  // ---- FICA — Social Security (employee + employer) ----
  // Capped at SS wage base. Need YTD-aware calc.
  const ssWageBase = FICA_2025.ss_wage_base;
  const ssApplicableThisPeriod = Math.max(0, Math.min(grossPerPeriod, ssWageBase - ytdGrossBefore));
  const ssEmployee = ssApplicableThisPeriod * FICA_2025.ss_rate_employee;
  const ssEmployer = ssApplicableThisPeriod * FICA_2025.ss_rate_employer;

  // ---- Medicare (employee + employer, no cap) + Additional Medicare ----
  const medicareEmployee = grossPerPeriod * FICA_2025.medicare_rate_employee;
  const medicareEmployer = grossPerPeriod * FICA_2025.medicare_rate_employer;
  // Additional Medicare 0.9% on YTD wages above $200K threshold (single payer threshold —
  // employer must withhold once any employee crosses $200K regardless of filing status)
  const addlMedThreshold = 200000;
  const addlMedThisPeriod = ytdGrossAfter > addlMedThreshold
    ? (ytdGrossAfter - Math.max(addlMedThreshold, ytdGrossBefore)) * FICA_2025.addl_medicare_rate
    : 0;

  // ---- CA SDI (employee only, no cap as of 2024) ----
  const caSDI = grossPerPeriod * CA_PAYROLL_TAXES_2025.sdi_rate_employee;

  // ---- CA PIT ----
  const caPIT = caWithholdingPerPeriod({ grossPerPeriod, payPeriods, de4 });

  // ---- Employer-side: FUTA, CA SUI, CA ETT (capped at $7K each) ----
  const futaApplicable = Math.max(0, Math.min(grossPerPeriod, CA_PAYROLL_TAXES_2025.futa_wage_base - ytdGrossBefore));
  const futa = futaApplicable * CA_PAYROLL_TAXES_2025.futa_rate;
  const suiApplicable = Math.max(0, Math.min(grossPerPeriod, CA_PAYROLL_TAXES_2025.sui_wage_base - ytdGrossBefore));
  const caSUI = suiApplicable * (caSuiRate || CA_PAYROLL_TAXES_2025.sui_rate_employer);
  const caETT = suiApplicable * CA_PAYROLL_TAXES_2025.ett_rate_employer;

  // ---- Totals ----
  const employeeWithheld = fedIncomeTax + ssEmployee + medicareEmployee + addlMedThisPeriod + caSDI + caPIT;
  const netPay = grossPerPeriod - employeeWithheld;

  // Federal deposit (EFTPS): FIT + SS both halves + Medicare both halves + Addl Medicare
  const fedDepositTotal = fedIncomeTax + ssEmployee + ssEmployer + medicareEmployee + medicareEmployer + addlMedThisPeriod;
  // California deposit (EDD): CA PIT + CA SDI + CA SUI + CA ETT
  const caDepositTotal = caPIT + caSDI + caSUI + caETT;

  // Employer's all-in cost for this paycheck
  const employerAllIn = grossPerPeriod + ssEmployer + medicareEmployer + futa + caSUI + caETT;

  return {
    period: periodNumber,
    grossPerPeriod,
    ytdGrossBefore,
    ytdGrossAfter,
    employee: {
      fedIncomeTax,
      ssEmployee,
      medicareEmployee,
      addlMedicare: addlMedThisPeriod,
      caPIT,
      caSDI,
      totalWithheld: employeeWithheld,
    },
    employer: {
      ssEmployer,
      medicareEmployer,
      futa,
      caSUI,
      caETT,
      total: ssEmployer + medicareEmployer + futa + caSUI + caETT,
    },
    netPay,
    deposits: {
      netToOwner: netPay,
      federal: fedDepositTotal,    // → EFTPS
      california: caDepositTotal,  // → EDD e-Services
    },
    employerAllInCost: employerAllIn,
  };
}

/**
 * Run all 12 monthly payroll periods for a year, accumulating YTD totals.
 * Returns array of paystubs and YTD running totals.
 */
function runFullYearPayroll({ annualSalary, w4, de4, caSuiRate }) {
  const payPeriods = 12;
  const stubs = [];
  let ytdGrossBefore = 0;
  for (let p = 1; p <= payPeriods; p++) {
    const stub = runPayroll({
      annualSalary, payPeriods, periodNumber: p,
      ytdGrossBefore, w4, de4, caSuiRate,
    });
    stubs.push(stub);
    ytdGrossBefore = stub.ytdGrossAfter;
  }
  // YTD totals
  const ytd = stubs.reduce((acc, s) => ({
    gross: acc.gross + s.grossPerPeriod,
    fedIncomeTax: acc.fedIncomeTax + s.employee.fedIncomeTax,
    ssEmployee: acc.ssEmployee + s.employee.ssEmployee,
    ssEmployer: acc.ssEmployer + s.employer.ssEmployer,
    medicareEmployee: acc.medicareEmployee + s.employee.medicareEmployee,
    medicareEmployer: acc.medicareEmployer + s.employer.medicareEmployer,
    addlMedicare: acc.addlMedicare + s.employee.addlMedicare,
    caPIT: acc.caPIT + s.employee.caPIT,
    caSDI: acc.caSDI + s.employee.caSDI,
    caSUI: acc.caSUI + s.employer.caSUI,
    caETT: acc.caETT + s.employer.caETT,
    futa: acc.futa + s.employer.futa,
    netPay: acc.netPay + s.netPay,
    fedDeposit: acc.fedDeposit + s.deposits.federal,
    caDeposit: acc.caDeposit + s.deposits.california,
  }), {
    gross:0, fedIncomeTax:0, ssEmployee:0, ssEmployer:0, medicareEmployee:0,
    medicareEmployer:0, addlMedicare:0, caPIT:0, caSDI:0, caSUI:0, caETT:0,
    futa:0, netPay:0, fedDeposit:0, caDeposit:0,
  });
  return { stubs, ytd };
}

/* ----- Payroll run persistence ----- */
function getPayrollRuns() {
  return Store.get('bxp.payroll_runs', []);
}
function savePayrollRuns(runs) {
  Store.set('bxp.payroll_runs', runs);
}
function logPayrollRun(run) {
  const runs = getPayrollRuns();
  runs.push({
    id: 'pr_' + Math.random().toString(36).slice(2, 10),
    ...run,
    created_at: new Date().toISOString(),
  });
  savePayrollRuns(runs);
}
function deletePayrollRun(id) {
  savePayrollRuns(getPayrollRuns().filter(r => r.id !== id));
}

/* ----- Federal deposit schedule ----- */
/**
 * Returns 'monthly' or 'semi_weekly' based on lookback period.
 * For owner-only S-corps with reasonable salaries, this is essentially
 * always monthly (lookback period total taxes ≤ $50,000).
 *
 * Monthly schedule: federal deposit due by 15th of following month.
 * (e.g., January payroll → February 15 deposit)
 */
function federalDepositDueDate(payrollMonth, year) {
  // Monthly schedule: 15th of next month, accounting for year roll
  const nextMonth = payrollMonth + 1;
  if (nextMonth > 12) return `${parseInt(year, 10) + 1}-01-15`;
  return `${year}-${String(nextMonth).padStart(2, '0')}-15`;
}

/* ----- 941 quarterly schedule ----- */
function form941DueDates(year) {
  return [
    { q: 1, label: 'Q1 941', period: 'Jan–Mar', dueDate: `${year}-04-30` },
    { q: 2, label: 'Q2 941', period: 'Apr–Jun', dueDate: `${year}-07-31` },
    { q: 3, label: 'Q3 941', period: 'Jul–Sep', dueDate: `${year}-10-31` },
    { q: 4, label: 'Q4 941', period: 'Oct–Dec', dueDate: `${parseInt(year, 10) + 1}-01-31` },
  ];
}

/* ----- DE 9 / DE 9C quarterly schedule (California) ----- */
function de9DueDates(year) {
  return [
    { q: 1, label: 'Q1 DE 9/9C', period: 'Jan–Mar', dueDate: `${year}-04-30` },
    { q: 2, label: 'Q2 DE 9/9C', period: 'Apr–Jun', dueDate: `${year}-07-31` },
    { q: 3, label: 'Q3 DE 9/9C', period: 'Jul–Sep', dueDate: `${year}-10-31` },
    { q: 4, label: 'Q4 DE 9/9C', period: 'Oct–Dec', dueDate: `${parseInt(year, 10) + 1}-01-31` },
  ];
}

/** Aggregate logged payroll runs into 941 form data. */
function form941Data(year, quarter) {
  const monthsInQ = { 1:[1,2,3], 2:[4,5,6], 3:[7,8,9], 4:[10,11,12] }[quarter];
  const runs = getPayrollRuns().filter(r => {
    const [y, m] = (r.payDate || '').split('-').map(Number);
    return String(y) === String(year) && monthsInQ.includes(m);
  });
  return runs.reduce((acc, r) => ({
    wages: acc.wages + (r.gross || 0),
    fedIncomeTax: acc.fedIncomeTax + (r.fedIncomeTax || 0),
    ssWages: acc.ssWages + (r.ssWages || 0),
    medicareWages: acc.medicareWages + (r.medicareWages || 0),
    ssTax: acc.ssTax + (r.ssTotal || 0),
    medicareTax: acc.medicareTax + (r.medicareTotal || 0),
    addlMedicare: acc.addlMedicare + (r.addlMedicare || 0),
    fedDeposits: acc.fedDeposits + (r.fedDeposit || 0),
    runs: acc.runs + 1,
  }), {wages:0,fedIncomeTax:0,ssWages:0,medicareWages:0,ssTax:0,medicareTax:0,addlMedicare:0,fedDeposits:0,runs:0});
}

/** Aggregate logged payroll runs into DE 9 (California) form data. */
function de9Data(year, quarter) {
  const monthsInQ = { 1:[1,2,3], 2:[4,5,6], 3:[7,8,9], 4:[10,11,12] }[quarter];
  const runs = getPayrollRuns().filter(r => {
    const [y, m] = (r.payDate || '').split('-').map(Number);
    return String(y) === String(year) && monthsInQ.includes(m);
  });
  return runs.reduce((acc, r) => ({
    wages: acc.wages + (r.gross || 0),
    caPIT: acc.caPIT + (r.caPIT || 0),
    caSDI: acc.caSDI + (r.caSDI || 0),
    caSUI: acc.caSUI + (r.caSUI || 0),
    caETT: acc.caETT + (r.caETT || 0),
    caDeposits: acc.caDeposits + (r.caDeposit || 0),
    runs: acc.runs + 1,
  }), {wages:0,caPIT:0,caSDI:0,caSUI:0,caETT:0,caDeposits:0,runs:0});
}

  const fullYear = runFullYearPayroll({ annualSalary, w4, de4, caSuiRate });

    };

}

/**
 * Modal: confirm and log a payroll run for a specific month.
 */
function openPayrollDialog(month, stub, year) {
  const monthLabels = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const today = new Date();
  // Default pay date: last weekday of the target month
  let defaultPayDate = new Date(parseInt(year, 10), month, 0);
  while (defaultPayDate.getDay() === 0 || defaultPayDate.getDay() === 6) {
    defaultPayDate.setDate(defaultPayDate.getDate() - 1);
  }
  const defaultPayDateIso = defaultPayDate.toISOString().slice(0, 10);

  openModal(`
    <div class="modal-title">Log ${monthLabels[month-1]} ${year} payroll run</div>
    <div class="muted tiny mt-8 mb-16">Confirm the numbers below match what you actually paid (or are about to pay). The tool stores this so YTD totals roll forward correctly.</div>

    <div class="field">
      <label>Pay date</label>
      <input type="date" id="prPayDate" value="${defaultPayDateIso}"/>
    </div>

    <div style="background:var(--bg-alt);padding:14px 18px;border-radius:6px;margin:16px 0;font-size:13px">
      <div class="row" style="justify-content:space-between;padding:3px 0"><span>Gross</span><span style="font-family:var(--mono);font-weight:600">${fmt.money(stub.grossPerPeriod, {absolute:true})}</span></div>
      <div class="row" style="justify-content:space-between;padding:3px 0"><span style="color:var(--accent-2)">→ Net to your account</span><span style="font-family:var(--mono);font-weight:600;color:var(--accent-2)">${fmt.money(stub.netPay, {absolute:true})}</span></div>
      <div class="row" style="justify-content:space-between;padding:3px 0"><span style="color:var(--navy)">→ EFTPS deposit</span><span style="font-family:var(--mono);font-weight:600;color:var(--navy)">${fmt.money(stub.deposits.federal, {absolute:true})}</span></div>
      <div class="row" style="justify-content:space-between;padding:3px 0"><span style="color:var(--navy)">→ EDD deposit</span><span style="font-family:var(--mono);font-weight:600;color:var(--navy)">${fmt.money(stub.deposits.california, {absolute:true})}</span></div>
    </div>

    <div class="field">
      <label>Note (optional)</label>
      <input type="text" id="prNote" placeholder="e.g., wired from Boyd Mortgage operating to personal"/>
    </div>

    <div class="cert-block" style="margin-top:0;font-size:11.5px;padding:14px 18px">
      <strong>Three transfers to make:</strong>
      <ol style="margin:8px 0 0 18px;padding:0;line-height:1.6">
        <li>Wire <strong>${fmt.money(stub.netPay, {absolute:true})}</strong> from S-corp operating account → your personal checking</li>
        <li>EFTPS payment of <strong>${fmt.money(stub.deposits.federal, {absolute:true})}</strong> (form 941 deposit)</li>
        <li>EDD e-Services payment of <strong>${fmt.money(stub.deposits.california, {absolute:true})}</strong> (DE 88 / DE 9 deposit)</li>
      </ol>
    </div>

    <div class="row mt-16" style="justify-content:flex-end;gap:8px">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="confirmPayrollBtn">Log payroll run</button>
    </div>
  `);

  document.getElementById('confirmPayrollBtn').onclick = () => {
    const payDate = document.getElementById('prPayDate').value;
    if (!payDate) { toast('Pick a pay date.'); return; }
    logPayrollRun({
      payDate,
      month,
      year: parseInt(year, 10),
      gross: stub.grossPerPeriod,
      fedIncomeTax: stub.employee.fedIncomeTax,
      ssEmployee: stub.employee.ssEmployee,
      ssEmployer: stub.employer.ssEmployer,
      ssTotal: stub.employee.ssEmployee + stub.employer.ssEmployer,
      ssWages: Math.min(stub.grossPerPeriod, FICA_2025.ss_wage_base - stub.ytdGrossBefore),
      medicareEmployee: stub.employee.medicareEmployee,
      medicareEmployer: stub.employer.medicareEmployer,
      medicareTotal: stub.employee.medicareEmployee + stub.employer.medicareEmployer,
      medicareWages: stub.grossPerPeriod,
      addlMedicare: stub.employee.addlMedicare,
      caPIT: stub.employee.caPIT,
      caSDI: stub.employee.caSDI,
      caSUI: stub.employer.caSUI,
      caETT: stub.employer.caETT,
      futa: stub.employer.futa,
      netPay: stub.netPay,
      fedDeposit: stub.deposits.federal,
      caDeposit: stub.deposits.california,
      fedDepositPaid: false,
      caDepositPaid: false,
      note: document.getElementById('prNote').value,
    });
    closeModal();
    toast(`${monthLabels[month-1]} ${year} payroll logged.`);
    render();
  };
}

/* =========================================================================
   DATA INSPECTOR — ground-truth diagnostic for what's actually in the data
   ========================================================================= */
let _inspectorQuery = '';

function renderInspector(root) {
  // Compute status breakdown across all transactions
  const total = state.transactions.length;
  const byStatus = {};
  const byCatBy = {};
  const byCategory = {};
  for (const t of state.transactions) {
    byStatus[t.status || 'unknown'] = (byStatus[t.status || 'unknown'] || 0) + 1;
    byCatBy[t.categorized_by || 'untagged'] = (byCatBy[t.categorized_by || 'untagged'] || 0) + 1;
    byCategory[t.category || 'unknown'] = (byCategory[t.category || 'unknown'] || 0) + 1;
  }

  // Outstanding = anything in pending status (the review queue)
  const reviewItems = state.transactions.filter(needsReview);
  const outstanding = reviewItems.length;

  // Filter by query if any — uses RAW substring match, not token match,
  // so the user can search exactly as the description appears.
  const q = _inspectorQuery.trim().toLowerCase();
  const filtered = q
    ? state.transactions.filter(t => (t.description || '').toLowerCase().includes(q))
    : state.transactions;

  // Sort by date desc
  const sorted = [...filtered].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const showCount = Math.min(50, sorted.length);

  root.innerHTML = `
    ${renderBrandBand({
      eyebrow: 'Diagnostics',
      title: 'Data Inspector',
      sub: 'Search, audit, and bulk-fix what\u2019s actually in your database'
    })}
    <div class="card mb-16">
      <div class="card-h"><div><div class="card-eyebrow">Health Check</div><div class="card-title">${total.toLocaleString()} total transactions in database</div></div></div>

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-top:16px">
        <div>
          <div class="card-eyebrow">By status</div>
          ${Object.entries(byStatus).sort((a,b)=>b[1]-a[1]).map(([k,v]) => `
            <div class="row" style="justify-content:space-between;padding:4px 0;font-size:13px">
              <span style="font-family:var(--mono)">${escapeHTML(k)}</span>
              <span style="font-variant-numeric:tabular-nums">${v}</span>
            </div>`).join('')}
        </div>
        <div>
          <div class="card-eyebrow">By source</div>
          ${Object.entries(byCatBy).sort((a,b)=>b[1]-a[1]).map(([k,v]) => `
            <div class="row" style="justify-content:space-between;padding:4px 0;font-size:13px">
              <span style="font-family:var(--mono)">${escapeHTML(k)}</span>
              <span style="font-variant-numeric:tabular-nums">${v}</span>
            </div>`).join('')}
        </div>
        <div>
          <div class="card-eyebrow">By category</div>

            <div class="row" style="justify-content:space-between;padding:4px 0;font-size:13px">
              <span>${CAT_BY_ID[k]?.name || k}</span>
              <span style="font-variant-numeric:tabular-nums">${v}</span>
            </div>`).join('')}
        </div>
      </div>

      <div class="mapping-warn" style="margin-top:18px">
        <div><strong>${outstanding} outstanding in review queue.</strong> These are transactions with <code style="font-family:var(--mono);background:var(--bg-2);padding:1px 5px;border-radius:3px">status: pending</code>. They never reach <code style="font-family:var(--mono);background:var(--bg-2);padding:1px 5px;border-radius:3px">auto</code> status because either their AI confidence was below 0.85, the category isn't fully deductible, or amount &gt; $500. Use the search below to find specific items, or click <strong>Approve all yellow-risk items</strong> to bulk-clear them.</div>
        <div class="row mt-8" style="gap:8px">
          <button class="btn btn-sm btn-primary" id="reevalStatusBtn">Re-evaluate auto/pending status</button>
          <button class="btn btn-sm" id="approveAllYellowBtn">Approve all yellow-risk items in queue</button>
          <button class="btn btn-sm" id="copyDescsBtn">Copy all unique descriptions to clipboard</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><div><div class="card-eyebrow">Search transactions by raw text</div><div class="card-title">Find what's actually in your data</div></div></div>
      <div class="field mt-12">
        <input type="text" id="inspectorSearch" value="${escapeHTML(_inspectorQuery)}" placeholder="Type any substring of a description (case-insensitive). e.g., 'ucdhs' or 'sacramento' or 'PATS'" autofocus />
        <div class="field-hint">This is a raw substring search — exactly what the bank wrote. Use this to find your transactions and see precisely what their descriptions look like.</div>
      </div>

      <div class="muted mt-12 mb-8" style="font-size:13px">
        ${q ? `Found <strong>${filtered.length}</strong> transactions containing "${escapeHTML(q)}"` : `Showing first ${showCount} of ${total.toLocaleString()} transactions`}
        ${filtered.length > showCount ? ` · Showing first ${showCount}` : ''}
      </div>

      <div style="max-height:600px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm)">
        <table class="tbl" style="margin:0">
          <thead><tr>
            <th style="padding-left:14px;width:90px">Date</th>
            <th>Description (raw)</th>
            <th>Category</th>
            <th style="width:90px">Status</th>
            <th style="width:90px">Source</th>
            <th class="num" style="width:90px;padding-right:14px">Amount</th>
          </tr></thead>
          <tbody>
            ${sorted.slice(0, showCount).map(t => `
              <tr>
                <td style="padding-left:14px" class="muted tiny">${fmt.dateShort(t.date)}</td>
                <td><span style="font-family:var(--mono);font-size:11px">${escapeHTML(t.description)}</span></td>
                <td>${CAT_BY_ID[t.category]?.name || t.category}</td>
                <td><code style="font-family:var(--mono);font-size:10px;background:var(--bg-2);padding:2px 6px;border-radius:3px">${t.status || '—'}</code></td>
                <td><code style="font-family:var(--mono);font-size:10px;background:var(--bg-2);padding:2px 6px;border-radius:3px">${t.categorized_by || '—'}</code></td>
                <td class="num" style="padding-right:14px">${fmt.money(t.amount)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById('inspectorSearch').oninput = (e) => {
    _inspectorQuery = e.target.value;
    // Debounce: only re-render after a brief pause
    clearTimeout(window._inspTimer);
    window._inspTimer = setTimeout(() => render(), 150);
  };

  document.getElementById('reevalStatusBtn').onclick = () => {
    if (!confirm('Re-evaluate auto/pending status for all AI-categorized transactions using the current rules? This applies the latest status logic without re-calling the API. User-corrected and rule-applied transactions are preserved.')) return;
    let promoted = 0;
    for (const t of state.transactions) {
      if (t.categorized_by !== 'ai') continue;
      if (t.status === 'approved' || t.status === 'corrected') continue;
      const cat = CAT_BY_ID[t.category];
      if (!cat) continue;
      if (t.category === 'excluded' || cat.deductible === 'no') {
        if (t.status !== 'auto') { t.status = 'auto'; t.risk = 'gray'; promoted++; }
      } else if (t.category === 'review' || t.category === 'uncategorized') {
        // Stay in review queue
      } else if ((t.confidence || 0) >= 0.85) {
        if (t.status !== 'auto') {
          t.status = 'auto';
          t.risk = cat.deductible === 'full' ? 'green' : 'yellow';
          promoted++;
        }
      }
      if (Math.abs(t.amount) > 500 && t.status === 'auto' && cat.deductible !== 'full') {
        t.status = 'pending'; t.risk = 'yellow';
      }
    }
    saveTransactions();
    render();
    toast(`${promoted} transactions promoted from review queue to auto-approved.`);
  };

  document.getElementById('approveAllYellowBtn').onclick = () => {
    const yellow = state.transactions.filter(t => t.status === 'pending' && t.risk === 'yellow' && t.category !== 'review' && t.category !== 'uncategorized');
    if (yellow.length === 0) { toast('No auto-approvable yellow items.'); return; }
    if (!confirm(`Bulk-approve ${yellow.length} yellow-risk items? They have a category assigned (by AI or rule) — this just confirms them.`)) return;
    for (const t of yellow) {
      t.status = 'approved';
      t.confidence = 1.0;
    }
    saveTransactions();
    render();
    toast(`Approved ${yellow.length} items.`);
  };

  document.getElementById('copyDescsBtn').onclick = () => {
    const uniq = [...new Set(state.transactions.map(t => t.description))].sort();
    navigator.clipboard.writeText(uniq.join('\n'));
    toast(`Copied ${uniq.length} unique descriptions to clipboard.`);
  };
}

      saveSettings();
    };
  });
  const taxNumberFields = [
    'set_tax_reasonable_salary', 'set_tax_other_income',
    'set_tax_prior_year_federal', 'set_tax_prior_year_state',
  ];
  taxNumberFields.forEach(id => {
    const el = document.getElementById(id);

      s[id.replace(/^set_/, '')] = parseFloat(e.target.value) || 0;
      saveSettings();
    };
  });
  const qbiToggle = document.getElementById('set_tax_use_qbi');
  if (qbiToggle) qbiToggle.onchange = (e) => { s.tax_use_qbi = e.target.checked; saveSettings(); };

    };
  });
  document.querySelectorAll('[data-setting]').forEach(sel => {

  document.getElementById('set_ai_model').onchange = (e) => { s.ai_model = e.target.value; saveSettings(); };

    if (!s.ai_api_key) { toast('Paste your API key first.'); return; }
    const btn = document.getElementById('aiTestBtn');
    btn.disabled = true; btn.textContent = 'Testing…';
    try {
      const result = await aiCategorizeBatch(
        [{ id: 'test_1', description: 'STARBUCKS COFFEE #1234', amount: -5.45, date: '2026-04-15' }],

      );

        toast(`✓ API key works. Test result: "${result[0].category}" (${Math.round((result[0].confidence||0)*100)}%)`);
      } else {
        toast('Got a response but format was unexpected. Check console.');
      }
    } catch (err) {
      toast('API test failed: ' + err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'Test API key';
    }
  };

  document.getElementById('aiRunNowBtn').onclick = async () => {
    s.ai_api_key = document.getElementById('set_ai_api_key').value.trim();
    saveSettings();
    if (!s.ai_api_key) { toast('Add your API key first.'); return; }
    if (state.transactions.length === 0) { toast('No transactions to categorize.'); return; }

    const eligible = state.transactions.filter(t =>
      t.status !== 'approved' && t.status !== 'corrected' && t.category !== 'excluded'
    );
    if (eligible.length === 0) { toast('Nothing eligible for AI re-classification (all approved or excluded).'); return; }
    if (!confirm(`Send ${eligible.length} transactions to Claude for categorization? Estimated cost: ~$${(eligible.length * 0.0001).toFixed(3)} on Haiku.`)) return;

    const prog = showAIProgress('Re-classifying with Claude');
    try {
      const { updated, errors, retried, unresolved } = await aiCategorizeMany(state.transactions, s, prog.update);
      saveTransactions();
      prog.close();
      const parts = [`✓ Updated ${updated} transactions`];
      if (retried) parts.push(`${retried} required a retry pass`);
      if (unresolved) parts.push(`${unresolved} couldn't be resolved`);
      if (errors.length > 0) parts.push(`${errors.length} batch(es) errored — see console`);
      toast(parts.join(' · '));
      render();
    } catch (err) {
      prog.close();
      toast('AI run failed: ' + err.message);
    }
  };

  document.getElementById('exportJSONBtn').onclick = () => {
    const data = { transactions: state.transactions, rules: state.rules, settings: state.settings, exported_at: new Date().toISOString() };
    download(JSON.stringify(data, null, 2), `ledger-backup-${new Date().toISOString().slice(0,10)}.json`, 'application/json');
  };
  document.getElementById('importJSONBtn').onclick = () => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json';
    inp.onchange = (e) => {
      const f = e.target.files[0];
      const r = new FileReader();
      r.onload = () => {
        try {
          const d = JSON.parse(r.result);
          if (d.transactions) state.transactions = d.transactions;
          if (d.rules) state.rules = d.rules;
          if (d.settings) state.settings = d.settings;
          saveTransactions(); saveRules(); saveSettings();
          render();
          toast('Data imported.');
        } catch (err) { toast('Invalid JSON.'); }
      };
      r.readAsText(f);
    };
    inp.click();
  };
  document.getElementById('rerunWizardBtn').onclick = openWizard;
  document.getElementById('resetBtn').onclick = () => {
    if (!confirm('Wipe all transactions, rules, and settings? This cannot be undone.')) return;
    Store.wipe();
    state.transactions = []; state.rules = []; state.upload = null;
    state.settings = { entity:'My Business', account:'Business Account', business_only_account:true, posture:'moderate', restaurants:'meals', groceries:'review', gas:'review', bigbox:'review' };
    render();
    toast('All data cleared.');
  };
}

    ]},
    { label:'Posture', q:'How aggressive should categorization be?', help:'You can change this any time in Settings.', field:'posture', type:'choice', options:[
      { value:'conservative', label:'Conservative', desc:'Flag more · safer audit profile' },
      { value:'moderate',     label:'Moderate',     desc:'Balanced · most operators sit here' },
      { value:'aggressive',   label:'Aggressive',   desc:'Categorize when reasonable · fewer flags' }
    ]},
  ];

  const draft = { ...state.settings };
  let stepIdx = 0;

  function show() {
    const s = steps[stepIdx];
    let body = '';
    if (s.type === 'text') {
      body = `<div class="field"><input type="text" id="wiz_input" placeholder="${s.placeholder||''}" value="${escapeHTML(draft[s.field]||'')}"/></div>`;
    } else {
      body = `<div class="radios">
        ${s.options.map(o => `
          <label class="radio ${String(draft[s.field])===String(o.value)?'selected':''}">
            <input type="radio" name="wizopt" value="${o.value}" ${String(draft[s.field])===String(o.value)?'checked':''}/>
            <div>
              <div class="radio-label">${o.label}</div>
              ${o.desc ? `<div class="radio-desc">${o.desc}</div>` : ''}
            </div>
          </label>`).join('')}
      </div>`;
    }
    const html = `
      <div class="modal-h">
        <div>
          <div class="card-eyebrow">${s.label} · ${stepIdx+1} of ${steps.length}</div>
          <div class="modal-title" style="font-size:22px;margin-top:4px">Setup wizard</div>
        </div>
        <button class="close-x" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="wiz-prog">${steps.map((_, i) => `<div class="wiz-prog-step ${i<stepIdx?'done':(i===stepIdx?'active':'')}"></div>`).join('')}</div>
        <div class="wiz-q">${s.q}</div>
        <div class="wiz-help">${s.help||''}</div>
        ${body}
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="wizPrev" ${stepIdx===0?'disabled style="opacity:.4"':''}>← Back</button>
        <button class="btn btn-primary" id="wizNext">${stepIdx === steps.length-1 ? 'Finish' : 'Next →'}</button>
      </div>`;
    openModal(html);

    if (s.type === 'choice') {
      document.querySelectorAll('input[name="wizopt"]').forEach(r => {
        r.onchange = () => {
          let v = r.value;
          if (v === 'true') v = true; else if (v === 'false') v = false;
          draft[s.field] = v;
          document.querySelectorAll('.radio').forEach(el => el.classList.remove('selected'));
          r.closest('.radio').classList.add('selected');
        };
      });
    }
    document.getElementById('wizPrev').onclick = () => { if (stepIdx > 0) { stepIdx--; show(); } };
    document.getElementById('wizNext').onclick = () => {
      if (s.type === 'text') draft[s.field] = document.getElementById('wiz_input').value.trim() || draft[s.field];
      if (stepIdx === steps.length - 1) {
        Object.assign(state.settings, draft);
        saveSettings();
        Store.set('bxp.wizard_complete', true);
        recategorizeAll();
        closeModal();
        toast('Setup complete · rules applied');
        render();
      } else {
        stepIdx++; show();
      }
    };
  }
  show();
}

/* =========================================================================
   MODAL / TOAST
   ========================================================================= */
function openModal(html) {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal() {
  document.getElementById('modalRoot').innerHTML = '';
}
function toast(msg) {
  const w = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  w.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 3200);
}

document.getElementById('monthPill').onclick = () => {
  const months = getMonths();
  const html = `
    <div class="modal-h">
      <div class="modal-title">Select period</div>
      <button class="close-x" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="radios">
        <label class="radio ${state.filters.month==='all'?'selected':''}"><input type="radio" name="mo" value="all" ${state.filters.month==='all'?'checked':''}/><div><div class="radio-label">All months</div></div></label>
        ${months.map(m => `<label class="radio ${state.filters.month===m?'selected':''}"><input type="radio" name="mo" value="${m}" ${state.filters.month===m?'checked':''}/><div><div class="radio-label">${fmt.monthLabel(m)}</div></div></label>`).join('')}
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="applyMo">Apply</button>
    </div>`;
  openModal(html);
  document.querySelectorAll('input[name="mo"]').forEach(r => {
    r.onchange = () => {
      document.querySelectorAll('.radio').forEach(el => el.classList.remove('selected'));
      r.closest('.radio').classList.add('selected');
    };
  });
  document.getElementById('applyMo').onclick = () => {
    state.filters.month = document.querySelector('input[name="mo"]:checked').value;
    document.getElementById('monthPillLabel').textContent = fmt.monthLabel(state.filters.month);
    closeModal();
    render();
  };
};

/* =========================================================================
   INIT
   ========================================================================= */
async function init() {
  // Expose toast globally so the Store can surface errors before init completes
  window.toast = toast;

  // Render a brief loading state so the screen isn't blank during IDB open
  const root = document.getElementById('view');
  if (root) root.innerHTML = '<div class="card empty"><h3>Loading…</h3><p>Reading your saved data.</p></div>';

  // Hydrate from IndexedDB (or migrate from legacy localStorage on first run)
  try {
    await Store.loadAll();
  } catch (e) {
    console.error('Store load failed:', e);
  }

  // Populate state from cache
  state.transactions = Store.get('bxp.transactions', []);
  state.rules = Store.get('bxp.rules', []);
  state.settings = { ...DEFAULT_SETTINGS, ...Store.get('bxp.settings', {}) };

  // Storage status indicator
  const label = Store.backend === 'idb' ? 'Local · saved'
              : Store.backend === 'local' ? 'Local · saved (legacy)'
              : 'Session only';
  const el = document.getElementById('storageStatus');
  if (el) el.textContent = label;

  // First-run wizard
  if (!Store.get('bxp.wizard_complete', false) && state.transactions.length === 0) {
    setTimeout(openWizard, 300);
  }

  navigate('dashboard');
}
init();
